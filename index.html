        MINERVA.toast('Schlüssel gespeichert.');
        if (p.tmdb) anreichern(false);
      }).catch(function (e) { MINERVA.toast(e && e.message ? e.message : String(e)); });
    }
  });

  MINERVA.searchProviders.push(function (q) {
    return W().filter(function (w) { return MINERVA.matches(q, [w.Titel, w.Originaltitel, w.Genres]); }).map(function (w) {
      return { title: w.Titel, meta: (w.Art === 'serie' ? 'Serie' : 'Film') + ' · ' + (w.Status === 'angefangen' ? 'angefangen' : 'Watchlist'), modName: 'APOLLO', icon: w.Art === 'serie' ? 'tv' : 'film', open: function () { MINERVA.go('apollo', 'watchlist'); openDetail(w); } };
    }).concat(SP().filter(function (s) { return MINERVA.matches(q, [s.Titel, s.Notiz, s.Genres]); }).map(function (s) {
      return { title: s.Titel, meta: 'Spiel · ' + plattformen(s).join(', '), modName: 'APOLLO', icon: 'gamepad', open: function () { MINERVA.go('apollo', 'sammlung'); openSpiel(s); } };
    }));
  });
})();
</script>

  <script>
/* =========================================================
   MINERVA-App – Hülle um die bekannte Oberfläche
   • Verbindung: Adresse der Apps-Script-Schnittstelle + geheimer Schlüssel (nur auf diesem Gerät gespeichert).
   • Schneller Start: Die letzten Daten liegen auf dem Gerät und erscheinen sofort; frische Daten kommen im Hintergrund.
   • Offline: Änderungen werden auf dem Gerät gemerkt und gesendet, sobald wieder Internet da ist.
   ========================================================= */
const MINERVA_APP = (function () {
  const LS = 'minerva.verbindung';
  const NUR_ONLINE = 'Das geht nur mit Internet. Deine Änderungen an Listen werden offline trotzdem gemerkt.';
  let cfg = null;
  try { cfg = JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { cfg = null; }
  let outbox = [];
  let flushing = null;
  let letzterAbgleich = 0;

  /* ---------- Kleiner Speicher auf dem Gerät (IndexedDB) ---------- */
  let dbP = null;
  function db() {
    if (!dbP) dbP = new Promise(function (res, rej) {
      const r = indexedDB.open('minerva', 1);
      r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbP;
  }
  function get(k) {
    return db().then(function (d) { return new Promise(function (res) { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = function () { res(q.result); }; q.onerror = function () { res(undefined); }; }); }).catch(function () { return undefined; });
  }
  function set(k, v) {
    return db().then(function (d) { return new Promise(function (res) { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = function () { res(); }; t.onerror = function () { res(); }; }); }).catch(function () {});
  }
  function del(k) {
    return db().then(function (d) { return new Promise(function (res) { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = function () { res(); }; t.onerror = function () { res(); }; }); }).catch(function () {});
  }

  /* ---------- Server ---------- */
  function netzFehler(e) { return !(e && e.server); }
  function post(fn, args) {
    if (!cfg) return Promise.reject(Object.assign(new Error('Die App ist noch nicht verbunden.'), { server: true }));
    if (!navigator.onLine) return Promise.reject(new Error('offline'));
    return fetch(cfg.api, { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: cfg.key, fn: fn, args: args || [] }) })
      .then(function (r) {
        if (!r.ok) throw new Error('Server antwortet nicht (' + r.status + ')');
        return r.json().catch(function () { throw Object.assign(new Error('Die Adresse liefert keine MINERVA-Daten. Ist es die /exec-Adresse mit Zugriff „Jeder“?'), { server: true }); });
      })
      .then(function (j) {
        if (!j || !j.ok) throw Object.assign(new Error((j && j.error) || 'Unbekannter Fehler'), { server: true });
        return j.data;
      });
  }

  /* ---------- Warteschlange für Offline-Änderungen ---------- */
  function merkeOutbox() { set('outbox', outbox); status(); }
  function flush() {
    if (flushing) return flushing;
    if (!outbox.length) return Promise.resolve();
    flushing = (function weiter() {
      if (!outbox.length) return Promise.resolve();
      const x = outbox[0];
      return post(x.fn, x.args).then(function () { outbox.shift(); merkeOutbox(); return weiter(); }, function (e) {
        if (netzFehler(e)) throw e; // später erneut
        outbox.shift(); merkeOutbox();
        MINERVA.toast('Eine gemerkte Änderung ließ sich nicht speichern: ' + e.message);
        return weiter();
      });
    })().then(function () { flushing = null; }, function (e) { flushing = null; throw e; });
    return flushing;
  }

  /* ---------- Daten auf dem Gerät sichern ---------- */
  let saveT = null;
  function sichern() {
    clearTimeout(saveT);
    saveT = setTimeout(function () { if (MINERVA.data) set('daten', MINERVA.data); }, 800);
  }

  /* ---------- Status-Pille: offline / Änderungen warten ---------- */
  function status() {
    let el = document.getElementById('app-status');
    if (!el) { el = document.createElement('button'); el.id = 'app-status'; el.type = 'button'; el.setAttribute('data-act', 'app.sync'); document.body.appendChild(el); }
    const n = outbox.length;
    const txt = !navigator.onLine ? 'Offline' + (n ? ' · ' + n + ' Änderung' + (n > 1 ? 'en' : '') + ' gemerkt' : '') : (n ? n + ' Änderung' + (n > 1 ? 'en' : '') + ' werden gesendet …' : '');
    el.textContent = txt; el.hidden = !txt;
  }

  /* ---------- MINERVA an die App anpassen ---------- */
  function anpassen() {
    MINERVA.api = function (fn) {
      const args = Array.prototype.slice.call(arguments, 1);
      return post(fn, args).then(function (d) {
        if (fn === 'ariadneData' && d && !d.fehler) set('ariadne', d);
        return d;
      }, function (e) {
        if (!netzFehler(e)) throw e;
        if (fn === 'ariadneData') return get('ariadne').then(function (d) { if (d) return d; throw new Error(NUR_ONLINE); });
        if (fn === 'getBootstrap' && MINERVA.data) return MINERVA.data;
        throw new Error(NUR_ONLINE);
      });
    };
    MINERVA.call = function (fn, args, slice) {
      const self = this;
      const merken = function () { outbox.push({ fn: fn, args: args || [] }); merkeOutbox(); sichern(); return undefined; };
      if (outbox.length) { merken(); flush().then(nachFlush, function () {}); return Promise.resolve(undefined); }
      self.pending[slice] = (self.pending[slice] || 0) + 1;
      return post(fn, args || []).then(function (d) {
        self.pending[slice]--;
        if (slice === '*' && d && !self.pending[slice]) { Object.assign(self.data, d); self.render(); }
        else if (slice && d && !self.pending[slice]) { self.data[slice] = d; self.render(); }
        return d;
      }, function (err) {
        self.pending[slice]--;
        if (netzFehler(err)) { merken(); return undefined; }
        self.toast(err.message);
        return self.reload();
      });
    };
    MINERVA.reload = function () {
      const self = this;
      return flush().catch(function () {}).then(function () { return post('getBootstrap', []); }).then(function (d) {
        letzterAbgleich = Date.now();
        if (outbox.length) return; // noch nicht alles gesendet: lokale Daten behalten
        self.data = d; self.render(); sichern();
      }, function (e) {
        if (!netzFehler(e)) throw e;
        if (!self.data) throw new Error('Keine Verbindung und noch keine Daten auf diesem Gerät.');
        status();
      });
    };
    const render = MINERVA.render;
    MINERVA.render = function () { render.apply(this, arguments); sichern(); };
    MINERVA.actions['app.sync'] = function () { MINERVA.actions['g.sync'](); };
    MINERVA.actions['app.trennen'] = function () {
      MINERVA.confirmDelete({ simple: true, title: 'App trennen?', text: 'Die Verbindung und die Daten auf diesem Gerät werden entfernt. Im Sheet bleibt alles.' + (outbox.length ? ' Achtung: ' + outbox.length + ' gemerkte Änderungen gehen verloren.' : ''), onConfirm: function () {
        localStorage.removeItem(LS); Promise.all([del('daten'), del('ariadne'), del('outbox')]).then(function () { location.reload(); });
      } });
    };
    MINERVA.corePanels = MINERVA.corePanels || [];
    MINERVA.corePanels.push(function () {
      const n = outbox.length;
      return '<section class="panel"><div class="sechead"><span class="cicon t-lila">' + ic('sync') + '</span><h2>Diese App</h2></div><div class="form">' +
        '<span class="small">' + (navigator.onLine ? 'Online' : 'Offline') + ' · ' + (n ? n + ' Änderung' + (n > 1 ? 'en warten' : ' wartet') + ' auf Internet' : 'alles gesendet') +
        (letzterAbgleich ? ' · zuletzt abgeglichen ' + new Date(letzterAbgleich).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '') + '</span>' +
        '<div class="grid2"><button class="btn ghost" data-act="g.sync">' + ic('sync', 18) + ' Jetzt abgleichen</button><button class="btn ghost" data-act="app.trennen">Verbindung trennen</button></div></div></section>';
    });
  }
  function nachFlush() { if (!outbox.length) MINERVA.reload().catch(function () {}); }

  /* ---------- Verbinden ---------- */
  function verbindenHtml(fehler) {
    const h = new URLSearchParams(location.hash.slice(1));
    return '<div class="card glass" style="max-width:560px;margin:8vh auto 0;gap:14px">' +
      '<span class="brandrow">' + '<img class="brandicon" src="' + MINERVA_ICON + '" alt=""><span class="brand">MINERVA</span></span>' +
      '<h1 class="title">App verbinden</h1>' +
      '<p class="sub" style="margin:0">Einmal pro Gerät: Trag die Adresse deiner Apps-Script-Schnittstelle und deinen Schlüssel ein. Beides bleibt nur auf diesem Gerät.</p>' +
      field('app-api', 'Adresse (endet auf /exec)', '<input id="app-api" class="input" autocomplete="off" spellcheck="false" inputmode="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(h.get('api') || '') + '">') +
      field('app-key', 'Schlüssel', '<input id="app-key" class="input" type="password" autocomplete="off" spellcheck="false" value="' + esc(h.get('key') || '') + '">') +
      (fehler ? '<p class="small" style="margin:0;color:var(--lila-dd)">' + esc(fehler) + '</p>' : '') +
      '<button class="btn" id="app-go">Verbinden</button></div>';
  }
  function zeigeVerbinden(fehler) {
    document.getElementById('view').innerHTML = verbindenHtml(fehler);
    document.getElementById('app-go').onclick = function () {
      const api = document.getElementById('app-api').value.trim(), key = document.getElementById('app-key').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(api)) { zeigeVerbinden('Die Adresse muss mit https://script.google.com beginnen und auf /exec enden.'); return; }
      if (key.length < 20) { zeigeVerbinden('Der Schlüssel ist zu kurz. Kopier ihn vollständig aus dem Protokoll von appEinrichten().'); return; }
      this.disabled = true; this.textContent = 'Verbinde …';
      cfg = { api: api, key: key };
      post('getBootstrap', []).then(function (d) {
        localStorage.setItem(LS, JSON.stringify(cfg));
        history.replaceState(null, '', location.pathname);
        set('daten', d).then(function () { location.reload(); });
      }, function (e) { cfg = null; zeigeVerbinden(e.message === 'offline' ? 'Gerade keine Internetverbindung.' : e.message); });
    };
  }

  /* ---------- Start ---------- */
  function start() {
    if (!cfg) { zeigeVerbinden(''); return; }
    anpassen();
    window.addEventListener('online', function () { status(); flush().then(nachFlush, function () {}); });
    window.addEventListener('offline', status);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - letzterAbgleich > 5 * 60000 && !MINERVA.modal) MINERVA.reload().catch(function () {});
    });
    Promise.all([get('daten'), get('outbox')]).then(function (r) {
      outbox = Array.isArray(r[1]) ? r[1] : [];
      window.__BOOT__ = r[0] || null;
      MINERVA.boot(); // zeigt die Daten vom Gerät sofort an (oder lädt sie, wenn noch keine da sind)
      status();
      if (r[0]) MINERVA.reload().catch(function (e) { MINERVA.toast(e.message); });
    });
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
      navigator.serviceWorker.addEventListener('message', function (e) { if (e.data === 'neu') MINERVA.toast('Neue Version geladen. Sie ist beim nächsten Öffnen aktiv.'); });
    }
  }
  return { start: start };
})();
</script>
  <script>MINERVA_APP.start();</script>
