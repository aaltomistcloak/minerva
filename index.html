<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <title>MINERVA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EEF1F4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MINERVA">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
/* =========================================================
   MINERVA – gemeinsames Design (Life-Overlay, hell, Glas)
   Alle Farben und Radien als Variablen: hier zentral ändern.
   ========================================================= */
:root {
  --ink: #1C1F2A; --ink-2: #4A5064; --ink-3: #5A6072; --muted: #6A7083;
  --lila: #8B7CF6; --lila-d: #5B4FD0; --lila-dd: #4B40B8;
  --petrol: #0E7C86; --petrol-d: #0E6F78;
  --blau: #2F6FDB; --blau-d: #24509E;
  --gruen: #2E9E7A; --gruen-d: #22785D;
  --glass: rgba(255,255,255,0.66); --glass-line: rgba(255,255,255,0.95);
  --panel: rgba(255,255,255,0.6);
  --shadow: 0 12px 40px rgba(60,64,100,0.12);
  --shadow-s: 0 8px 24px rgba(60,64,100,0.10);
  --g-janus: linear-gradient(135deg, #A797F8, #6B58E3);
  --g-vesta: linear-gradient(135deg, #E7A2C6, #B2639F);
  --g-blau: linear-gradient(135deg, #8DB4FF, #4B73DE);
  --g-clio: linear-gradient(135deg, #6CCAD4, #2A8DA2);
  --g-harmonia: linear-gradient(135deg, #84D3AA, #379B76);
  --g-ariadne: linear-gradient(135deg, #93B9F4, #3E6CC6);
  --g-core: linear-gradient(135deg, #1C1F2A, #4A5064);
  --r-xl: 28px; --r-l: 22px; --r-m: 18px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: #EEF1F4; }
body {
  font-family: 'Outfit', 'Segoe UI', system-ui, sans-serif; color: var(--ink);
  background: linear-gradient(180deg, #D9E4F4 0%, #E9EBF5 40%, #EEF1F4 100%) fixed;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.45; }
:focus-visible { outline: 3px solid rgba(139,124,246,0.55); outline-offset: 2px; }
h1, h2, h3 { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Hintergrund-„Szene“ */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; }
.b1 { width: 260px; height: 260px; background: #fff; filter: blur(40px); opacity: .9; top: 20px; right: 4%; }
.b2 { width: 70vw; max-width: 800px; height: 300px; background: #C7BEF4; filter: blur(60px); opacity: .6; top: 25%; left: -20%; }
.b3 { width: 70vw; max-width: 800px; height: 340px; background: #A8DCD6; filter: blur(60px); opacity: .65; top: 55%; right: -25%; }
.b4 { width: 80vw; max-width: 900px; height: 360px; background: #B7CCF0; filter: blur(70px); opacity: .55; bottom: -140px; left: -15%; }

/* Grundflächen */
.glass { background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow); }
.panel { background: var(--panel); border: 1px solid var(--glass-line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 10px 32px rgba(60,64,100,0.08); border-radius: var(--r-xl); padding: 8px; display: flex; flex-direction: column; min-width: 0; }
.card { border-radius: var(--r-xl); padding: 18px; display: flex; flex-direction: column; gap: 14px; }

/* Layout */
.app { position: relative; z-index: 1; display: flex; gap: 20px; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); min-height: 100vh; }
.main { flex: 1; min-width: 0; max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 120px; }
.rail, .side { display: none; }
.loading { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }

/* Kopfzeile in Untermodulen */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.iconbtn { width: 52px; height: 52px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow-s); color: var(--ink); }
.iconbtn.dark { background: var(--ink); color: #fff; border: none; }
.iconbtn.on { background: var(--ink); color: #fff; }
.iconbtn.sm { width: 44px; height: 44px; box-shadow: none; background: rgba(28,31,42,0.05); border: none; color: var(--ink-2); }
.crumb { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); padding: 8px 16px; border-radius: 20px; background: rgba(255,255,255,0.55); border: 1px solid var(--glass-line); text-align: center; }
.crumb b { font-weight: 600; letter-spacing: .2em; }
.spacer { width: 52px; flex: none; }

/* Typografie */
.brand { font-size: 15px; font-weight: 600; letter-spacing: .42em; background: linear-gradient(90deg, #6D5EF0, #0E7C86); -webkit-background-clip: text; background-clip: text; color: transparent; align-self: flex-start; }
.hello { font-size: 34px; font-weight: 400; letter-spacing: -.015em; line-height: 1.1; }
.title { font-size: 26px; font-weight: 500; letter-spacing: -.01em; }
.h2 { font-size: 17px; font-weight: 500; margin: 8px 4px 0; }
.sub { font-size: 15px; color: var(--ink-2); }
.small { font-size: 13px; color: var(--ink-3); }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 500; color: var(--lila-dd); }
.badge { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: rgba(123,108,246,0.14); color: var(--lila-dd); align-self: flex-start; white-space: nowrap; }
.badge.petrol { background: rgba(14,124,134,0.12); color: var(--petrol-d); }
.badge.blau { background: rgba(47,111,219,0.12); color: var(--blau-d); }
.badge.grau { background: rgba(28,31,42,0.06); color: var(--ink-2); }
.count { font-size: 13px; color: var(--ink-2); padding: 4px 10px; border-radius: 12px; background: rgba(28,31,42,0.05); white-space: nowrap; }

/* Bedienelemente */
.btn { min-height: 48px; padding: 0 20px; border-radius: 24px; border: none; background: var(--ink); color: #fff; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: rgba(255,255,255,0.65); color: var(--ink); border: 1px solid rgba(28,31,42,0.14); }
.btn.soft { background: rgba(47,111,219,0.12); color: var(--blau-d); }
.btn.lila { background: rgba(123,108,246,0.14); color: var(--lila-dd); }
.btn.sm { min-height: 40px; font-size: 13px; padding: 0 14px; border-radius: 20px; }
.btn.big { min-height: 56px; font-size: 16px; border-radius: 28px; }
.btn.center { align-self: center; }
.dashed { min-height: 52px; border-radius: 20px; border: 1px dashed rgba(28,31,42,0.22); background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; width: 100%; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; border-radius: 26px; background: rgba(28,31,42,0.05); }
.seg button { min-height: 46px; border: none; border-radius: 22px; background: transparent; color: var(--ink-2); font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 8px; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 500; box-shadow: 0 4px 12px rgba(60,64,100,0.12); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 20px; font-size: 13px; background: rgba(255,255,255,0.6); border: 1px solid rgba(28,31,42,0.10); }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.input { width: 100%; min-height: 50px; padding: 0 18px; border-radius: 25px; border: 1px solid rgba(28,31,42,0.12); background: rgba(255,255,255,0.88); font-size: 16px; outline: none; }
.input:focus { border-color: var(--lila); box-shadow: 0 0 0 3px rgba(139,124,246,0.2); }
textarea.input { padding: 14px 16px; border-radius: 20px; min-height: 96px; resize: vertical; line-height: 1.4; }
select.input { appearance: none; -webkit-appearance: none; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline .input { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 20px; background: rgba(123,108,246,0.10); border: 1px solid rgba(123,108,246,0.25); }
.empty { padding: 18px 14px; text-align: center; color: var(--ink-3); font-size: 15px; }

/* Fortschritt */
.ring { position: relative; width: 104px; height: 104px; flex: none; }
.ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 500; }
.ring circle.val { transition: stroke-dashoffset .4s ease; }
.bar { height: 8px; border-radius: 8px; background: rgba(28,31,42,0.07); overflow: hidden; flex: 1; }
.bar > span { display: block; height: 100%; border-radius: 8px; background: linear-gradient(90deg, var(--lila), var(--petrol)); transition: width .3s; }
.bar.blau > span { background: linear-gradient(90deg, var(--blau), var(--lila)); }
.bar.gruen > span { background: linear-gradient(90deg, var(--gruen), var(--petrol)); }
.stat { display: flex; align-items: center; gap: 16px; }
.stat > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

/* Abschnitte & Zeilen */
.sechead { display: flex; align-items: center; gap: 12px; padding: 8px 10px 6px; }
.sechead h2 { font-size: 16px; font-weight: 500; flex: 1; min-width: 0; }
.cicon { width: 38px; height: 38px; border-radius: 13px; display: flex; align-items: center; justify-content: center; flex: none; }
.t-lila { background: rgba(123,108,246,0.13); color: var(--lila-d); }
.t-petrol { background: rgba(14,124,134,0.12); color: var(--petrol-d); }
.t-blau { background: rgba(47,111,219,0.12); color: var(--blau-d); }
.t-gruen { background: rgba(46,158,122,0.13); color: var(--gruen-d); }
.rowwrap { display: flex; align-items: center; gap: 4px; }
.row { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 6px 10px; border: none; border-radius: 18px; background: transparent; width: 100%; text-align: left; }
.row:hover { background: rgba(255,255,255,0.5); }
.row.current { background: rgba(123,108,246,0.12); box-shadow: inset 0 0 0 1.5px rgba(123,108,246,0.35); }
.chk { width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.85); border: 1.5px solid rgba(28,31,42,0.22); color: var(--ink-3); font-size: 13px; font-weight: 500; transition: all .2s; }
.row.current .chk { border-color: var(--lila); color: var(--lila-d); }
.row.done .chk { background: linear-gradient(135deg, var(--lila), var(--petrol)); border-color: transparent; color: #fff; }
.vesta .row.done .chk { background: linear-gradient(135deg, var(--gruen), var(--petrol)); }
.row .txt { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.row .name { font-size: 16px; }
.row.done .name { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(28,31,42,0.3); }
.row .meta { font-size: 12px; color: var(--ink-3); }
.next { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 22px; background: linear-gradient(135deg, rgba(139,124,246,0.16), rgba(14,124,134,0.12)); border: 1px solid rgba(123,108,246,0.25); }
.next .nexttext { font-size: 22px; font-weight: 500; line-height: 1.2; }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.split { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rowwrap .iconbtn.sm { background: transparent; color: var(--muted); }
.rowwrap .iconbtn.sm:hover { background: rgba(28,31,42,0.06); color: var(--ink); }

/* Start */
.userpill { display: flex; align-items: center; gap: 10px; padding: 6px 16px 6px 6px; border-radius: 28px; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--g-janus); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 500; }
.greet { display: flex; flex-direction: column; gap: 6px; margin: 14px 4px 4px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.dcard { display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 26px; color: var(--ink); text-decoration: none; text-align: left; border: 1px solid var(--glass-line); }
.dcard .head { display: flex; align-items: center; gap: 12px; }
.dcard .head span { display: flex; flex-direction: column; gap: 1px; }
.dcard .mod { font-size: 12px; letter-spacing: .14em; color: var(--ink-2); font-weight: 600; }
.dcard .big { font-size: 22px; font-weight: 500; line-height: 1.2; }
.modtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.modtile { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 6px 14px; border-radius: 26px; background: rgba(255,255,255,0.55); border: 1px solid var(--glass-line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 8px 24px rgba(60,64,100,0.08); transition: all .2s; }
.modtile[aria-expanded="true"] { background: rgba(255,255,255,0.92); box-shadow: 0 14px 36px rgba(60,64,100,0.18); transform: translateY(-2px); }
.modicon { width: 60px; height: 60px; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.modicon.sm { width: 52px; height: 52px; border-radius: 17px; }
.modname { font-size: 13px; font-weight: 600; letter-spacing: .18em; }
.g-janus { background: var(--g-janus); } .g-vesta { background: var(--g-vesta); } .g-blau { background: var(--g-blau); } .g-clio { background: var(--g-clio); } .g-harmonia { background: var(--g-harmonia); } .g-ariadne { background: var(--g-ariadne); } .g-core { background: var(--g-core); }
.modpanel { border-radius: var(--r-xl); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.modpanel .mhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 0 4px 4px; }
.modpanel h3 { font-size: 18px; font-weight: 600; letter-spacing: .22em; }
.sublink { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 12px; border-radius: 20px; background: rgba(255,255,255,0.72); border: 1px solid rgba(28,31,42,0.06); width: 100%; text-align: left; }
.sublink .lbl { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.sublink .lbl b { font-size: 16px; font-weight: 500; }
.sublink[aria-current="page"] { box-shadow: inset 0 0 0 1.5px rgba(123,108,246,0.4); }

/* Navigation Handy */
.bottomnav { position: fixed; left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5; padding: 6px; border-radius: 30px; background: rgba(255,255,255,0.76); border: 1px solid var(--glass-line); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 12px 40px rgba(60,64,100,0.14); display: flex; gap: 4px; }
.bottomnav button { flex: 1; min-height: 52px; border-radius: 24px; border: none; background: transparent; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; font-weight: 500; letter-spacing: .08em; transition: flex .2s; }
.bottomnav button .lbl { display: none; }
.bottomnav button.active { flex: 1.6; background: var(--ink); color: #fff; }
.bottomnav button.active .lbl { display: inline; }

/* Navigation Tablet/PC */
.rail { flex-direction: column; align-items: center; gap: 10px; padding: 12px 10px; border-radius: 34px; position: sticky; top: 16px; align-self: flex-start; flex: none; max-height: calc(100vh - 32px); }
.rail .home { width: 56px; height: 56px; border-radius: 18px; background: var(--ink); color: #fff; border: none; font-weight: 600; font-size: 18px; letter-spacing: .04em; padding: 0; display: flex; align-items: center; justify-content: center; }
.rail .home img { width: 56px; height: 56px; display: block; }
.rail .home:has(img) { background: transparent; }
.brandrow { display: flex; align-items: center; gap: 10px; }
.brandrow .brand { align-self: center; }
.brandicon { width: 36px; height: 36px; display: block; filter: drop-shadow(0 4px 10px rgba(60,64,100,0.18)); }
.rail .sep { width: 32px; height: 1px; background: rgba(28,31,42,0.12); margin: 6px 0; }
.railbtn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; border-radius: 22px; border: none; background: transparent; }
.railbtn span.n { font-size: 10px; font-weight: 600; letter-spacing: .14em; }
.railbtn[aria-expanded="true"], .railbtn.active { background: rgba(255,255,255,0.95); box-shadow: 0 8px 20px rgba(60,64,100,0.15); }
.side { width: 300px; flex: none; padding: 22px 16px; border-radius: 32px; align-self: flex-start; position: sticky; top: 16px; flex-direction: column; gap: 10px; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: 100px; z-index: 10; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; max-width: min(92vw, 460px); padding: 14px 18px; border-radius: 20px; background: var(--ink); color: #fff; font-size: 15px; box-shadow: 0 12px 40px rgba(28,31,42,0.3); transition: all .25s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Karten (Ideen-Parkplatz, Bucket List) */
.stages { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stage { padding: 10px 12px; border-radius: 18px; background: rgba(255,255,255,0.7); border: 1px solid rgba(28,31,42,0.06); display: flex; flex-direction: column; gap: 2px; }
.stage b { font-size: 20px; font-weight: 500; }
.stage.full { box-shadow: inset 0 0 0 1.5px rgba(47,111,219,0.4); }
.kcard { padding: 14px; border-radius: 22px; background: rgba(255,255,255,0.72); border: 1px solid rgba(28,31,42,0.06); display: flex; flex-direction: column; gap: 12px; }
.kcard .ttl { font-size: 17px; font-weight: 500; }
.khead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.rate { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rate .lbl { width: 70px; font-size: 14px; color: var(--ink-2); }
.dots { display: flex; gap: 4px; }
.dots button { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid rgba(28,31,42,0.18); background: rgba(255,255,255,0.8); font-size: 13px; color: var(--ink-2); }
.dots button.on { background: linear-gradient(135deg, var(--blau), var(--lila)); color: #fff; border-color: transparent; }
.nextstep { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: 18px; background: linear-gradient(135deg, rgba(47,111,219,0.10), rgba(139,124,246,0.12)); }
.nextstep .eyebrow { color: var(--blau-d); }
.kactions { display: flex; gap: 8px; flex-wrap: wrap; }
.kactions .btn { flex: 1 1 auto; }
details.archive { border-radius: var(--r-xl); }
details.archive summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: 500; min-height: 52px; }
details.archive summary::-webkit-details-marker { display: none; }
.archrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid rgba(28,31,42,0.06); }

/* ---------- Tablet & PC ---------- */
@media (min-width: 760px) {
  .app { padding: 24px; }
  .rail { display: flex; }
  .side.open { display: flex; }
  .bottomnav { display: none; }
  .main { padding-bottom: 40px; }
  .phone-only { display: none !important; }
  .toast { bottom: 32px; }
}
@media (max-width: 759px) {
  .wide-only { display: none !important; }
}
/* Zweispaltige Ansichten (Routinen, Packliste, Einkauf, Ideen) */
@media (min-width: 1000px) {
  .split { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
  .split > .summary { position: sticky; top: 24px; }
  .sections.multi { display: block; columns: 260px; column-gap: 14px; }
  .sections.multi > section { break-inside: avoid; margin-bottom: 14px; }
  .sections.two .rows { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .routine .next .nexttext { font-size: 28px; }
  .routine .next .btn { min-height: 64px; font-size: 17px; border-radius: 32px; }
}

/* ---------- v2 ---------- */
.avatar { overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

          '<button class="row" data-act="au.toggle" data-id="' + esc(a.ID) + '" tabindex="-1" aria-hidden="true"><span class="txt"><span class="name">' + esc(a.Titel) + '</span>' + (a.Faellig && !a.Erledigt ? '<span class="meta">' + dueBadge(a) + '</span>' : '') + '</span></button>' +
          '<button class="iconbtn sm" data-act="au.edit" data-id="' + esc(a.ID) + '" aria-label="' + esc(a.Titel) + ' bearbeiten">' + ic('pen', 18) + '</button></div>';
      };
      const summary = '<div class="card glass summary"><div style="display:flex;flex-direction:column;gap:2px"><h1 class="title">Aufgaben</h1>' +
        '<span class="sub">' + open.length + ' offen' + (done.length ? ' · ' + done.length + ' erledigt' : '') + '</span></div>' +
        '<div class="tasknew"><label class="sr" for="au-new">Neue Aufgabe</label><input id="au-new" class="input" placeholder="Was steht an? z. B. Playlisten sortieren" data-enter="au.add" autocomplete="off">' +
        '<button class="iconbtn sm' + (ui.due ? ' on' : '') + '" data-act="au.duetoggle" aria-pressed="' + ui.due + '" aria-label="Deadline setzen" title="Deadline (optional)">' + ic('calendar', 18) + '</button>' +
        '<button class="iconbtn dark" data-act="au.add" aria-label="Hinzufügen">' + ic('plus', 20, 2) + '</button></div>' +
        (ui.due ? '<div class="inline"><label class="flabel" for="au-due" style="margin:0;white-space:nowrap">Deadline</label><input id="au-due" class="input" type="date" style="flex:1">' +
          '<button class="btn ghost sm" data-act="au.duetoggle">Keine Deadline</button></div>' : '') +

        (done.length ? '<section class="panel alldone"><div class="sechead"><span class="cicon t-gruen">' + ic('check', 18, 2.4) + '</span><h2>Erledigt</h2><span class="count">' + done.length + '</span></div><div class="rows">' + done.map(row).join('') + '</div></section>' : '');
      return topbar('JANUS', 'Aufgaben') + '<div class="split"><div class="summary">' + summary + '</div><div class="stack">' + list + '</div></div>';
    },
    after: function () { if (ui.edit) { const n = document.getElementById('au-edit'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } } }
  });

  Object.assign(MINERVA.actions, {
    'au.add': function () {
      const el = document.getElementById('au-new'); const v = (el && el.value || '').trim();
      if (!v) { if (el) el.focus(); return; }
      const dEl = document.getElementById('au-due'); const due = dEl && /^\d{4}-\d{2}-\d{2}$/.test(dEl.value) ? dEl.value : '';
      L().push({ ID: 'tmp_' + Date.now(), Titel: v, Faellig: due, Erledigt: false, Erstellt: new Date().toISOString() });
      MINERVA.render(); const n = document.getElementById('au-new'); if (n) { n.value = ''; n.focus(); }

    'au.duetoggle': function () { ui.due = !ui.due; MINERVA.render(); const n = document.getElementById(ui.due ? 'au-due' : 'au-new'); if (n) n.focus(); },
    'au.nodue': function () { const n = document.getElementById('au-editdue'); if (n) n.value = ''; },
    'au.toggle': function (ds) { L().forEach(function (a) { if (a.ID === ds.id) a.Erledigt = !a.Erledigt; }); MINERVA.render(); MINERVA.call('aufgabeToggle', [ds.id], 'janus'); },
    'au.edit': function (ds) { ui.edit = ds.id; MINERVA.render(); },
    'au.saveedit': function (ds) {
      const el = document.getElementById('au-edit'); const v = (el && el.value || '').trim(); if (!v) return;
      const dEl = document.getElementById('au-editdue'); const due = dEl && /^\d{4}-\d{2}-\d{2}$/.test(dEl.value) ? dEl.value : '';
      L().forEach(function (a) { if (a.ID === ds.id) { a.Titel = v; a.Faellig = due; } }); ui.edit = null; MINERVA.render(); MINERVA.call('aufgabeUpdate', [ds.id, v, due], 'janus');
    },
    'au.del': function (ds) { D().aufgaben = L().filter(function (a) { return a.ID !== ds.id; }); ui.edit = null; MINERVA.render(); MINERVA.call('aufgabeDelete', [ds.id], 'janus'); },
    'au.ask': function () { ui.confirm = true; MINERVA.render(); },
    'au.cancel': function () { ui.confirm = false; MINERVA.render(); },
    'au.clean': function () { D().aufgaben = L().filter(function (a) { return !a.Erledigt; }); ui.confirm = false; MINERVA.render(); MINERVA.call('aufgabenAufraeumen', [], 'janus'); }
  });

  MINERVA.searchProviders.push(function (q) {
    return L().filter(function (a) { return MINERVA.matches(q, [a.Titel]); }).map(function (a) {
      return { title: a.Titel, meta: 'Aufgabe · ' + (a.Erledigt ? 'erledigt' : 'offen'), modName: 'JANUS', icon: 'tasks', open: function () { MINERVA.go('janus', 'aufgaben'); } };
    });
  });

  MINERVA.summaries.push(function () {
    const open = L().filter(function (a) { return !a.Erledigt; }).sort(byDue);
    const done = L().length - open.length;
    const over = open.filter(function (a) { const n = daysTo(a.Faellig); return n !== null && n <= 0; }).length;
    return [{ prio: 0, mod: 'janus', sub: 'aufgaben', modName: 'JANUS', label: 'Aufgaben', icon: 'tasks',
      title: open.length ? open.length + ' Aufgabe' + (open.length > 1 ? 'n' : '') + ' offen' : 'Keine offenen Aufgaben',
      meta: (over ? over + ' fällig · ' : '') + open.slice(0, 2).map(function (a) { return a.Titel; }).join(' · ') + (open.length > 2 ? ' …' : ''), pct: L().length ? pct(done, L().length) : null }];
  });

  /* Deadlines der nächsten 14 Tage (und Überfälliges) unter „Demnächst“ */
  MINERVA.upcomingProviders = MINERVA.upcomingProviders || [];
  MINERVA.upcomingProviders.push(function () {
    return L().filter(function (a) { const n = daysTo(a.Faellig); return !a.Erledigt && n !== null && n <= 14; }).map(function (a) {
      const n = daysTo(a.Faellig);
      return { mod: 'janus', act: 'nav.go', sub: 'aufgaben', icon: 'tasks', tint: 't-lila', title: a.Titel, days: n,

    });
  });
})();
</script>

  <script>
/* JANUS · Packliste

   Reset nur manuell – entfernt beide Status, die Gegenstände bleiben. */
(function () {
  const ui = { trip: null, confirm: false, form: null, coll: {}, sort: false, allq: '' };
  const D = function () { return MINERVA.data.janus; };
  const listOf = function (map, t) { return map[t] = map[t] || []; };

  function currentTrip() {
    const d = D();
    if (ui.trip && d.trips.some(function (t) { return t.ID === ui.trip; })) return ui.trip;
    const started = d.trips.filter(function (t) { return (d.packed[t.ID] || []).length || ((d.skipped || {})[t.ID] || []).length; })[0];
    return (started || d.trips[0] || {}).ID;
  }
  function statusOf(trip, id) {
    const d = D();
    if ((d.packed[trip] || []).indexOf(id) > -1) return 'gepackt';
    if (((d.skipped || {})[trip] || []).indexOf(id) > -1) return 'skip';
    return '';
  }
  function model() {
    const d = D(), trip = currentTrip();
    let packed = 0, skipped = 0, total = 0;
    const cats = d.cats.map(function (c) {
      const items = d.items.filter(function (i) { return i.KategorieID === c.ID && i.tags.indexOf(trip) > -1; }).map(function (i) {
        const st = statusOf(trip, i.ID); total++;
        if (st === 'gepackt') packed++; else if (st === 'skip') skipped++;
        return { i: i, st: st };
      });
      return { c: c, items: items };
    }).filter(function (x) { return x.items.length; });
    const t = d.trips.filter(function (x) { return x.ID === trip; })[0] || {};
    return { trip: trip, tripName: t.Name || '', cats: cats, packed: packed, skipped: skipped, total: total, open: total - packed - skipped };
  }
  function tagText(i) {
    if (i.alle) return 'Alle Trips';
    const names = {}; D().trips.forEach(function (t) { names[t.ID] = t.Kurzname; });
    return i.tags.map(function (t) { return names[t] || t; }).join(' · ');
  }
  function setStatus(trip, id, st) {
    const d = D(); d.skipped = d.skipped || {};
    [listOf(d.packed, trip), listOf(d.skipped, trip)].forEach(function (arr) { const k = arr.indexOf(id); if (k > -1) arr.splice(k, 1); });
    if (st === 'gepackt') listOf(d.packed, trip).push(id);
    if (st === 'skip') listOf(d.skipped, trip).push(id);
    MINERVA.render();
    MINERVA.call('packSetStatus', [trip, id, st], 'janus');
  }

  /* ---------- Doppelte vermeiden: ähnliche Gegenstände beim Anlegen zeigen ---------- */
  const simple = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); };
  function similar(name) {
    const v = simple(name); if (v.length < 3) return [];
    return D().items.filter(function (i) { const n = simple(i.Name); return n === v || (v.length >= 4 && (n.indexOf(v) > -1 || v.indexOf(n) > -1)); }).slice(0, 4);
  }
  function dupHtml(name) {
    const list = similar(name); if (!list.length) return '';
    const cats = {}; D().cats.forEach(function (c) { cats[c.ID] = c.Name; });
    const trip = currentTrip();
    return '<b style="font-weight:500">Gibt es schon:</b>' + list.map(function (i) {
      const inTrip = i.tags.indexOf(trip) > -1;
      return '<span class="dup"><span>' + esc(i.Name) + ' <span class="small">· ' + esc(cats[i.KategorieID] || '') + ' · ' + esc(tagText(i)) + '</span></span>' +
        (inTrip ? '<span class="small">schon in dieser Liste</span>' : '<button class="btn soft sm" data-act="pack.dupuse" data-id="' + esc(i.ID) + '">Hier verwenden</button>') + '</span>';
    }).join('');
  }

  /* ---------- Reihenfolge: Gegenstände per Griff verschieben ---------- */
  function reorder(cat, visibleIds) {
    const d = D();
    const all = d.items.filter(function (i) { return i.KategorieID === cat; });
    const vis = {}; visibleIds.forEach(function (id) { vis[id] = true; });
    const queue = visibleIds.slice();
    const ids = all.map(function (i) { return vis[i.ID] ? queue.shift() : i.ID; });
    const byId = {}; all.forEach(function (i) { byId[i.ID] = i; });
    d.items = d.items.filter(function (i) { return i.KategorieID !== cat; }).concat(ids.map(function (id) { return byId[id]; }));
    MINERVA.render();
    MINERVA.call('packReorder', [cat, ids.filter(function (id) { return id.indexOf('tmp_') !== 0; })], 'janus');
  }
  function startDrag(e) {
    const handle = e.currentTarget, row = handle.closest('.irow'), list = row && row.parentNode;
    if (!list) return;
    e.preventDefault();
    try { handle.setPointerCapture(e.pointerId); } catch (x) {}
    const before = Array.prototype.map.call(list.children, function (n) { return n.dataset.id; }).join(',');
    let startY = e.clientY;
    row.classList.add('dragging');
    function move(ev) {
      const prev = row.previousElementSibling, next = row.nextElementSibling;
      if (next && ev.clientY > next.getBoundingClientRect().top + next.offsetHeight / 2) { list.insertBefore(next, row); startY += next.offsetHeight; }
      else if (prev && ev.clientY < prev.getBoundingClientRect().top + prev.offsetHeight / 2) { list.insertBefore(row, prev); startY -= prev.offsetHeight; }
      row.style.transform = 'translateY(' + (ev.clientY - startY) + 'px)';
    }
    function up() {
      handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up);
      row.style.transform = ''; row.classList.remove('dragging');
      const ids = Array.prototype.map.call(list.children, function (n) { return n.dataset.id; });
      if (ids.join(',') !== before) reorder(list.dataset.cat, ids);
    }
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  }
  /** Mit der Tastatur: Pfeil hoch/runter auf dem Griff verschiebt um eine Stelle. */
  function keyMove(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    const row = e.currentTarget.closest('.irow'), list = row.parentNode;
    const other = e.key === 'ArrowUp' ? row.previousElementSibling : row.nextElementSibling; if (!other) return;
    e.preventDefault();
    if (e.key === 'ArrowUp') list.insertBefore(row, other); else list.insertBefore(other, row);
    const id = row.dataset.id;
    reorder(list.dataset.cat, Array.prototype.map.call(list.children, function (n) { return n.dataset.id; }));
    setTimeout(function () { const h = document.querySelector('.irow[data-id="' + id + '"] .grip'); if (h) h.focus(); }, 0);
  }

  /* ---------- Übersicht: alle Gegenstände aller Packlisten ---------- */
  function allHtml() {
    const d = D(), q = simple(ui.allq);
    const cats = d.cats.map(function (c) {
      const items = d.items.filter(function (i) { return i.KategorieID === c.ID; });
      return items.length ? '<div class="acat">' + esc(c.Name) + ' · ' + items.length + '</div>' + items.map(function (i) {
        const hide = q && simple(i.Name).indexOf(q) < 0;
        return '<div class="arow" data-name="' + esc(simple(i.Name)) + '"' + (hide ? ' hidden' : '') + '><b>' + esc(i.Name) + '</b><span class="trips">' + d.trips.map(function (t) {
          const on = i.tags.indexOf(t.ID) > -1;
          return '<button data-act="pack.alltag" data-id="' + esc(i.ID) + '" data-trip="' + esc(t.ID) + '" aria-pressed="' + on + '" aria-label="' + esc(i.Name) + ' – ' + esc(t.Name) + (on ? ' (enthalten)' : ' (nicht enthalten)') + '" title="' + esc(t.Name) + '">' + ic(t.Icon, 17) + '</button>';
        }).join('') + '</span></div>';
      }).join('') : '';
    }).join('');
    return '<div class="allitems stack" style="gap:10px"><div class="inline"><h2 class="mtitle" style="flex:1">Alle Gegenstände</h2>' +
      '<button class="iconbtn sm" data-act="modal.close" aria-label="Schließen">' + ic('x', 18) + '</button></div>' +
      '<p class="small" style="margin:0">' + d.items.length + ' Gegenstände in ' + d.trips.length + ' Packlisten. Tippe auf ein Symbol, um einen Gegenstand einer Packliste zuzuordnen oder ihn herauszunehmen.</p>' +
      '<label class="sr" for="pack-allq">Suchen</label><input id="pack-allq" class="input" placeholder="Suchen, z. B. Ladekabel" data-input="pack.allq" autocomplete="off" value="' + esc(ui.allq) + '">' +
      '<div class="alist">' + cats + '</div></div>';
  }

  /* ---------- Formular (Anlegen & Bearbeiten) ---------- */
  function openForm(item) {

      field('pack-name', 'Name', '<input id="pack-name" class="input" placeholder="z. B. Strandtuch" value="' + esc(f.name) + '" data-input="pack.fname" data-enter="pack.save" autocomplete="off">') +
      '<div class="duphint" id="pack-dup">' + (f.id ? '' : dupHtml(f.name)) + '</div>' +
      field('pack-cat', 'Kategorie', '<select id="pack-cat" class="input" data-change="pack.fcat">' +
        d.cats.map(function (c) { return '<option value="' + esc(c.ID) + '"' + (c.ID === f.cat ? ' selected' : '') + '>' + esc(c.Name) + '</option>'; }).join('') + '</select>') +
      '<span class="flabel">Für welche Trips? <span class="small">(nichts gewählt = alle)</span></span><div class="chips">' + d.trips.map(function (t) {
        return '<button class="chip" data-act="pack.ftag" data-id="' + esc(t.ID) + '" aria-pressed="' + (f.tags.indexOf(t.ID) > -1) + '">' + ic(t.Icon, 16) + ' ' + esc(t.Kurzname) + '</button>';
      }).join('') + '</div>' +
      '<div class="grid2"><button class="btn ghost" data-act="modal.close">Abbrechen</button><button class="btn" data-act="pack.save">' + (f.id ? 'Speichern' : 'Hinzufügen') + '</button></div>' +

    },

      const d = D(), m = model(), p = pct(m.packed + m.skipped, m.total);
      const summary =
        '<div class="card glass summary">' +
          '<div class="tabs" role="tablist" aria-label="Packliste wählen">' + d.trips.map(function (t) {
            return '<button role="tab" data-act="pack.trip" data-id="' + esc(t.ID) + '" aria-selected="' + (t.ID === m.trip) + '" aria-label="' + esc(t.Name) + '" title="' + esc(t.Name) + '">' + ic(t.Icon, 22) + '</button>';
          }).join('') + '</div>' +
          '<div class="stat">' + ring(p, 'Erledigt') + '<div><h1 class="title">' + esc(m.tripName) + '</h1>' +
          '<span class="sub">' + m.packed + ' eingepackt' + (m.skipped ? ' · ' + m.skipped + ' nicht benötigt' : '') + '</span>' +
          '<span class="small" style="color:var(--petrol-d);font-size:14px">' + (m.total && !m.open ? 'Alles erledigt – fertig gepackt.' : 'Noch ' + m.open + ' offen') + '</span></div></div>' +
          (ui.confirm ? confirmBox('Alle Häkchen und „nicht benötigt“-Markierungen für „' + m.tripName + '“ entfernen? Die Gegenstände bleiben in der Liste.', 'pack.reset', 'pack.cancel')
            : ((m.packed + m.skipped) ? '<button class="btn ghost sm center" data-act="pack.ask">' + ic('reset', 16) + ' Für nächste Reise zurücksetzen</button>' : '')) +
        '</div>' +
        (ui.sort ? '<p class="sorthint">Halte den Griff ' + ic('grip', 14) + ' und schiebe einen Gegenstand an seinen Platz. Die Reihenfolge gilt für alle Packlisten.</p>' +
          '<button class="btn" data-act="pack.sort">' + ic('check', 18, 2.4) + ' Fertig</button>'
        : '<button class="dashed" data-act="pack.add">' + ic('plus', 18) + ' Gegenstand hinzufügen</button>' +
          '<div class="packtools"><button class="btn ghost sm" data-act="pack.all">' + ic('list', 16) + ' Alle Gegenstände</button>' +
          '<button class="btn ghost sm" data-act="pack.sort">' + ic('grip', 16) + ' Reihenfolge ändern</button></div>' +
          '<p class="small legend">' + ic('check', 14, 2.6) + ' eingepackt · ' + ic('skip', 14) + ' diesmal nicht benötigt · ' + ic('pen', 14) + ' bearbeiten</p>');
      const complete = function (x) { return x.items.every(function (y) { return y.st; }); };
      const sections = m.cats.length ? sortDone(m.cats, complete).map(function (x) {
        const dn = x.items.filter(function (y) { return y.st; }).length;
        const done = complete(x);
        const key = m.trip + '/' + x.c.ID;
        const closed = ui.sort ? false : (ui.coll[key] !== undefined ? ui.coll[key] : done);
        if (ui.sort) {
          return '<section class="panel"><div class="sechead"><span class="cicon ' + tint(x.c.Farbe) + '">' + ic(x.c.Icon) + '</span><h2>' + esc(x.c.Name) + '</h2><span class="count">' + x.items.length + '</span></div>' +
            '<div class="rows" data-cat="' + esc(x.c.ID) + '">' + x.items.map(function (y) {

              '<button class="iconbtn sm" data-act="pack.edititem" data-id="' + esc(y.i.ID) + '" aria-label="' + esc(y.i.Name) + ' bearbeiten">' + ic('pen', 18) + '</button></div>';

      }).join('') : '<div class="panel"><p class="empty">Für diese Packliste gibt es noch keine Gegenstände.</p></div>';

        '<div class="split"><div class="stack summary">' + summary + '</div><div class="stack sections">' + sections + '</div></div>';
    },

      if (!ui.sort) return;
      el.querySelectorAll('.grip').forEach(function (h) { h.addEventListener('pointerdown', startDrag); h.addEventListener('keydown', keyMove); });
    }
  });

  Object.assign(MINERVA.actions, {
    'pack.trip': function (ds) { ui.trip = ds.id; ui.confirm = false; MINERVA.render(); },
    'pack.coll': function (ds, el) { ui.coll[ds.id] = el.getAttribute('aria-expanded') === 'true'; MINERVA.render(); },
    'pack.toggle': function (ds) { const t = currentTrip(); ui.trip = t; setStatus(t, ds.id, statusOf(t, ds.id) ? '' : 'gepackt'); },
    'pack.skip': function (ds) { const t = currentTrip(); ui.trip = t; setStatus(t, ds.id, statusOf(t, ds.id) === 'skip' ? '' : 'skip'); },
    'pack.ask': function () { ui.confirm = true; MINERVA.render(); },
    'pack.cancel': function () { ui.confirm = false; MINERVA.render(); },
    'pack.reset': function () {
      const t = currentTrip(), d = D(); ui.trip = t; d.packed[t] = []; (d.skipped = d.skipped || {})[t] = []; ui.confirm = false;
      MINERVA.render(); MINERVA.call('packReset', [t], 'janus');
    },
    'pack.sort': function () { ui.sort = !ui.sort; ui.confirm = false; MINERVA.render(); },
    'pack.all': function () { ui.allq = ''; MINERVA.openModal(allHtml, { top: true }); },
    'pack.allq': function (ds, el) {
      ui.allq = el.value; const q = simple(el.value);
      document.querySelectorAll('.allitems .arow').forEach(function (r) { r.hidden = !!q && r.dataset.name.indexOf(q) < 0; });
    },
    'pack.alltag': function (ds) {
      const d = D(), it = d.items.filter(function (i) { return i.ID === ds.id; })[0]; if (!it) return;
      const tags = it.tags.slice(), k = tags.indexOf(ds.trip);

      it.tags = d.trips.map(function (t) { return t.ID; }).filter(function (t) { return tags.indexOf(t) > -1; }); it.alle = false;
      MINERVA.renderModal(); MINERVA.render();
      MINERVA.call('packUpdateItem', [it.ID, { name: it.Name, kategorie: it.KategorieID, tags: it.tags.slice() }], 'janus');
    },
    'pack.dupuse': function (ds) {
      const d = D(), it = d.items.filter(function (i) { return i.ID === ds.id; })[0]; if (!it) return;
      const t = currentTrip(); if (it.tags.indexOf(t) < 0) it.tags.push(t); it.alle = false;
      MINERVA.closeModal(); MINERVA.render(); MINERVA.toast('„' + it.Name + '“ steht jetzt auch auf dieser Packliste.');
      MINERVA.call('packUpdateItem', [it.ID, { name: it.Name, kategorie: it.KategorieID, tags: it.tags.slice() }], 'janus');
    },
    'pack.add': function () { openForm(null); },
    'pack.edititem': function (ds) { const it = D().items.filter(function (i) { return i.ID === ds.id; })[0]; if (it) openForm(it); },
    'pack.fname': function (ds, el) { ui.form.name = el.value; const h = document.getElementById('pack-dup'); if (h && !ui.form.id) h.innerHTML = dupHtml(el.value); },
    'pack.fcat': function (ds, el) { ui.form.cat = el.value; },
    'pack.ftag': function (ds) { const t = ui.form.tags, k = t.indexOf(ds.id); if (k > -1) t.splice(k, 1); else t.push(ds.id); MINERVA.renderModal(); },
    'pack.save': function () {
      const f = ui.form, el = document.getElementById('pack-name');
      const name = ((el && el.value) || f.name || '').trim();
      if (!name) { MINERVA.toast('Bitte einen Namen eingeben.'); return; }
      const d = D(), all = !f.tags.length, tags = all ? d.trips.map(function (t) { return t.ID; }) : f.tags.slice();
      const payload = { name: name, kategorie: f.cat, tags: f.tags.slice() };
      if (f.id) {
        d.items.forEach(function (i) { if (i.ID === f.id) { i.Name = name; i.KategorieID = f.cat; i.tags = tags; i.alle = all; } });
        MINERVA.closeModal(); MINERVA.render(); MINERVA.call('packUpdateItem', [f.id, payload], 'janus');
      } else {
        d.items.push({ ID: 'tmp_' + Date.now(), Name: name, KategorieID: f.cat, tags: tags, alle: all });
        MINERVA.closeModal(); MINERVA.render(); MINERVA.call('packAddItem', [payload], 'janus');
        MINERVA.toast('„' + name + '“ hinzugefügt.');

    'pack.del': function (ds) {
      const it = D().items.filter(function (i) { return i.ID === ds.id; })[0]; if (!it) return;

        const d = D(); d.items = d.items.filter(function (i) { return i.ID !== ds.id; }); MINERVA.render();
        MINERVA.call('packDeleteItem', [ds.id], 'janus');

    }
  });

  MINERVA.searchProviders.push(function (q) {
    const d = D(), names = {}; d.trips.forEach(function (t) { names[t.ID] = t.Name; });
    const cats = {}; d.cats.forEach(function (c) { cats[c.ID] = c.Name; });
    const out = d.trips.filter(function (t) { return MINERVA.matches(q, [t.Name, t.Kurzname, 'Packliste']); }).map(function (t) {

    });
    return out.concat(d.items.filter(function (i) { return MINERVA.matches(q, [i.Name, cats[i.KategorieID]]); }).map(function (i) {
      return { title: i.Name, meta: 'Packliste · ' + (cats[i.KategorieID] || '') + ' · ' + (i.alle ? 'Alle Trips' : i.tags.map(function (t) { return names[t] || t; }).join(', ')), modName: 'JANUS', icon: 'pack',

  MINERVA.summaries.push(function () {

      const total = d.items.filter(function (i) { return i.tags.indexOf(t.ID) > -1; }).length;
      out.push({ mod: 'janus', sub: 'packliste', modName: 'JANUS', label: 'Packliste', icon: 'pack', title: t.Name, meta: pk + ' eingepackt' + (sk ? ' · ' + sk + ' nicht benötigt' : '') + ' · ' + (total - pk - sk) + ' offen', pct: pct(pk + sk, total) });
    });
    return out;
  });
})();

  <script>
/* JANUS · Routinen – bewusst ohne Nummern und ohne feste Reihenfolge.
   Abschnitte einklappbar, erledigte Abschnitte rutschen nach unten. Reset nur manuell.
   Automatisch: Tag-Routine von ROUTINE_MORGEN_UHRZEIT (4) bis ROUTINE_WECHSEL_UHRZEIT (16), sonst Abend. */
(function () {
  const ui = { r: null, confirm: false, coll: {} };
  const D = function () { return MINERVA.data.janus; };

  function autoRoutine() { return MINERVA.dayPart() === 'morgen' ? 'tag' : 'abend'; }
  function currentRoutine() {
    const d = D();
    if (ui.r && d.routines.some(function (r) { return r.ID === ui.r; })) return ui.r;
    const pick = d.routines.filter(function (r) { return r.ID === autoRoutine(); })[0] || d.routines[0] || {};
    return pick.ID;
  }
  function model(rid) {
    const d = D(); const done = d.done[rid] || [];
    let n = 0, cnt = 0;
    const secs = d.sections.filter(function (s) { return s.RoutineID === rid; }).map(function (s) {
      const steps = d.steps.filter(function (x) { return x.AbschnittID === s.ID; }).map(function (x) {
        n++; const ok = done.indexOf(x.ID) > -1; if (ok) cnt++;
        return { x: x, ok: ok };
      });
      return { s: s, steps: steps, done: steps.length > 0 && steps.every(function (y) { return y.ok; }) };
    }).filter(function (s) { return s.steps.length; });
    const r = d.routines.filter(function (x) { return x.ID === rid; })[0] || {};
    return { rid: rid, name: r.Name || '', secs: secs, total: n, cnt: cnt };
  }

  MINERVA.register('janus/routinen', {
    /* Beim Öffnen immer passend zur Uhrzeit starten – eine manuelle Wahl gilt nur bis zum Verlassen. */
    enter: function () { ui.r = null; ui.confirm = false; },
    info: function () { return D().routines.map(function (r) { return r.Name; }).join(' & '); },
    render: function () {
      const d = D(), rid = currentRoutine(), m = model(rid), p = pct(m.cnt, m.total);
      const auto = rid === autoRoutine();
      const summary =
        '<div class="card glass summary">' +
          '<div class="seg" role="group" aria-label="Routine wählen">' + d.routines.map(function (r) {
            return '<button data-act="rt.pick" data-id="' + esc(r.ID) + '" aria-pressed="' + (r.ID === rid) + '">' + ic(r.Icon, 18) + esc(r.Name) + '</button>';
          }).join('') + '</div>' +
          '<div class="stat">' + ring(p, 'Erledigt') + '<div><h1 class="title">' + esc(m.name) + '-Routine</h1><span class="sub">' + m.cnt + ' von ' + m.total + ' erledigt</span>' +
          '<span class="small" style="color:var(--petrol-d);font-size:14px">' + (m.total && m.cnt === m.total ? 'Routine geschafft.' : (auto ? 'Passend zur Uhrzeit gewählt' : 'Manuell gewählt')) + '</span></div></div>' +
          (ui.confirm ? confirmBox('Alle Häkchen der ' + m.name + '-Routine entfernen?', 'rt.reset', 'rt.cancel')
            : (m.cnt ? '<button class="btn ghost sm center" data-act="rt.ask">' + ic('reset', 16) + ' Für morgen zurücksetzen</button>' : '')) +
        '</div>';
      const sections = sortDone(m.secs, function (x) { return x.done; }).map(function (x) {
        const dn = x.steps.filter(function (y) { return y.ok; }).length;
        const key = rid + '/' + x.s.ID;
        const closed = ui.coll[key] !== undefined ? ui.coll[key] : x.done;
        return '<section class="panel' + (x.done ? ' alldone' : '') + '"><button class="sechead toggle" data-act="rt.coll" data-id="' + esc(key) + '" aria-expanded="' + !closed + '">' +
          '<span class="cicon ' + tint(x.s.Farbe) + '">' + (x.done ? ic('check', 18, 2.4) : ic(x.s.Icon)) + '</span><h2>' + esc(x.s.Name) + '</h2><span class="count">' + dn + ' / ' + x.steps.length + '</span>' +
          '<span class="chev">' + ic('chevdown', 18) + '</span></button>' +
          (closed ? '' : '<div class="rows cols2">' + x.steps.map(function (y) {
            return '<button class="row' + (y.ok ? ' done' : '') + '" data-act="rt.toggle" data-id="' + esc(y.x.ID) + '" aria-pressed="' + y.ok + '">' +
              '<span class="chk">' + (y.ok ? ic('check', 14, 3) : '') + '</span><span class="txt">' +
              (y.x.Hinweis ? '<span class="badge">' + esc(y.x.Hinweis) + '</span>' : '') + '<span class="name">' + esc(y.x.Schritt) + '</span></span></button>';
          }).join('') + '</div>') + '</section>';
      }).join('') || '<div class="panel"><p class="empty">Diese Routine hat noch keine Schritte. Du kannst sie im Tabellenblatt „Routine_Schritte“ anlegen.</p></div>';
      return '<div class="routine stack">' + topbar('JANUS', 'Routinen') +
        '<div class="split"><div class="summary">' + summary + '</div><div class="stack">' + sections + '</div></div></div>';
    }
  });

  Object.assign(MINERVA.actions, {
    'rt.pick': function (ds) { ui.r = ds.id; ui.confirm = false; MINERVA.render(); },
    'rt.coll': function (ds, el) { ui.coll[ds.id] = el.getAttribute('aria-expanded') === 'true'; MINERVA.render(); },
    'rt.toggle': function (ds) {
      const d = D(), rid = currentRoutine(); ui.r = rid;
      const arr = d.done[rid] = d.done[rid] || [];
      const i = arr.indexOf(ds.id); if (i > -1) arr.splice(i, 1); else arr.push(ds.id);
      MINERVA.render(); MINERVA.call('routineToggle', [rid, ds.id], 'janus');
    },
    'rt.ask': function () { ui.confirm = true; MINERVA.render(); },
    'rt.cancel': function () { ui.confirm = false; MINERVA.render(); },
    'rt.reset': function () { const rid = currentRoutine(); ui.r = rid; D().done[rid] = []; ui.confirm = false; ui.coll = {}; MINERVA.render(); MINERVA.call('routineReset', [rid], 'janus'); }
  });

  MINERVA.searchProviders.push(function (q) {
    const d = D(), secs = {}; d.sections.forEach(function (s) { secs[s.ID] = s; });
    const rn = {}; d.routines.forEach(function (r) { rn[r.ID] = r.Name; });
    return d.steps.filter(function (x) { return MINERVA.matches(q, [x.Schritt, x.Hinweis, (secs[x.AbschnittID] || {}).Name]); }).map(function (x) {
      const s = secs[x.AbschnittID] || {};
      return { title: x.Schritt, meta: (rn[s.RoutineID] || '') + '-Routine · ' + (s.Name || ''), modName: 'JANUS', icon: 'rout',
        open: function () { MINERVA.go('janus', 'routinen'); ui.r = s.RoutineID; ui.coll[s.RoutineID + '/' + s.ID] = false; MINERVA.render(); } };
    });
  });

  MINERVA.summaries.unshift(function () {
    const d = D(), want = autoRoutine();
    const rid = (d.routines.filter(function (r) { return r.ID === want; })[0] || d.routines[0] || {}).ID; if (!rid) return [];
    const m = model(rid); if (!m.total) return [];
    return [{ prio: 10, mod: 'janus', sub: 'routinen', modName: 'JANUS', label: m.name + '-Routine', icon: 'rout',
      title: m.cnt + ' von ' + m.total + ' erledigt', meta: m.cnt === m.total ? 'Geschafft.' : (m.total - m.cnt) + ' offen', pct: pct(m.cnt, m.total) }];
  });
})();
</script>

  <script>
/* JANUS · Ideen-Parkplatz – erst ablegen, später entscheiden. Ohne Stufen, ohne Limits.
   Eine Idee kann zur Aufgabe werden, auf die Bucket List (CLIO) wandern oder verworfen werden.
   Nichts wird gelöscht: Im Blatt „Ideen“ bleibt jede Zeile mit ihrer Stufe erhalten. */
(function () {
  const ui = { form: null };
  const D = function () { return MINERVA.data.janus; };
  const L = function () { return D().ideen || (D().ideen = []); };
  const byId = function (id) { return L().filter(function (k) { return k.ID === id; })[0]; };

  function weiter(id, ziel) {
    const k = byId(id); if (!k) return;
    const now = new Date().toISOString();
    D().ideen = L().filter(function (x) { return x.ID !== id; });
    if (ziel === 'aufgabe') {
      (D().aufgaben = D().aufgaben || []).push({ ID: 'tmp_' + Date.now(), Titel: k.Titel, Faellig: '', Erledigt: false, Quelle: 'id:' + id, Erstellt: now });
      MINERVA.toast('Steht jetzt bei den Aufgaben.');
    } else if (ziel === 'wunsch') {
      const c = MINERVA.data.clio;
      if (c) (c.wuensche = c.wuensche || []).push({ ID: 'tmp_' + Date.now(), Titel: k.Titel, Kategorie: 'Sonstiges', Horizont: 'Irgendwann', Notiz: k.Notiz || '', Status: 'offen', Erstellt: now });
      MINERVA.toast('Auf der Bucket List in CLIO gemerkt.');
    } else {
      MINERVA.toast('Verworfen.');
    }
    MINERVA.render();
    MINERVA.call('ideeWeiter', [id, ziel], ziel === 'wunsch' ? '*' : 'janus');
  }

  function openForm(k) {
    ui.form = { id: k.ID, titel: k.Titel, notiz: k.Notiz || '' };
    MINERVA.openModal(function () {
      const f = ui.form;
      return '<h2 class="mtitle">Idee bearbeiten</h2>' +
        field('id-titel', 'Idee', '<textarea id="id-titel" class="input" rows="2">' + esc(f.titel) + '</textarea>') +
        field('id-notiz', 'Gedanken dazu (optional)', '<textarea id="id-notiz" class="input" rows="4" placeholder="Links, Fragen, warum es dich reizt …">' + esc(f.notiz) + '</textarea>') +
        '<div class="grid2"><button class="btn ghost" data-act="modal.close">Abbrechen</button><button class="btn" data-act="id.save">Speichern</button></div>';
    });
  }

  MINERVA.register('janus/ideen', {
    info: function () { const n = L().length; return n ? n + ' Idee' + (n > 1 ? 'n' : '') + ' geparkt' : 'Kopf frei'; },
    render: function () {
      const ideas = L();
      const summary = '<div class="card glass summary">' +
        '<div style="display:flex;flex-direction:column;gap:2px"><h1 class="title">Ideen-Parkplatz</h1><span class="sub">Erst ablegen, später entscheiden.</span></div>' +
        '<label class="sr" for="idee-new">Neue Idee</label><textarea id="idee-new" class="input" rows="3" placeholder="Was geht dir gerade durch den Kopf?" data-enter="id.add"></textarea>' +
        '<button class="btn big" data-act="id.add">' + ic('plus', 18, 2) + ' Ablegen</button>' +
        '<p class="small" style="margin:0">Wenn eine Idee reif ist, wird sie zur Aufgabe oder wandert auf die Bucket List. Alles andere darf einfach liegen bleiben.</p></div>';
      const list = '<section class="panel"><div class="sechead"><span class="cicon t-lila">' + ic('dump') + '</span><h2>Geparkt</h2><span class="count">' + ideas.length + '</span></div>' +
        (ideas.length ? '<div class="stack" style="gap:8px;padding:4px">' + ideas.map(function (k) {
          return '<div class="kcard"><div class="khead"><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="ttl">' + esc(k.Titel) + '</span>' +
            (k.Notiz ? '<span class="small">' + esc(k.Notiz) + '</span>' : '') + '<span class="small">' + esc(age(k.Erstellt)) + '</span></div>' +
            '<button class="iconbtn sm" data-act="id.edit" data-id="' + esc(k.ID) + '" aria-label="Idee bearbeiten">' + ic('pen', 18) + '</button></div>' +
            '<div class="kactions"><button class="btn soft sm" data-act="id.weiter" data-id="' + esc(k.ID) + '" data-ziel="aufgabe">' + ic('tasks', 16) + ' Als Aufgabe</button>' +
            '<button class="btn lila sm" data-act="id.weiter" data-id="' + esc(k.ID) + '" data-ziel="wunsch">' + ic('star', 16) + ' Auf die Bucket List</button>' +
            '<button class="btn ghost sm" data-act="id.weiter" data-id="' + esc(k.ID) + '" data-ziel="verworfen">' + ic('x', 16) + ' Verwerfen</button></div></div>';
        }).join('') + '</div>' : '<p class="empty">Noch nichts abgelegt. Alles, was dir einfällt, darf hier erst mal liegen.</p>') + '</section>';
      return topbar('JANUS', 'Ideen-Parkplatz') + '<div class="split"><div class="summary">' + summary + '</div><div class="stack">' + list + '</div></div>';
    }
  });

  Object.assign(MINERVA.actions, {
    'id.add': function () {
      const el = document.getElementById('idee-new'); const v = (el && el.value || '').trim();
      if (!v) { if (el) el.focus(); return; }
      L().unshift({ ID: 'tmp_' + Date.now(), Titel: v, Notiz: '', Erstellt: new Date().toISOString() });
      MINERVA.render();
      const n = document.getElementById('idee-new'); if (n) { n.value = ''; n.focus(); }
      MINERVA.call('ideeAdd', [v], 'janus');
    },
    'id.weiter': function (ds) { weiter(ds.id, ds.ziel); },
    'id.edit': function (ds) { const k = byId(ds.id); if (k) openForm(k); },
    'id.save': function () {
      const f = ui.form, t = (document.getElementById('id-titel').value || '').trim();
      if (!t) { MINERVA.toast('Bitte einen Text eingeben.'); return; }

        '<div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:8px">' + (r.Notizen ? '<p style="margin:0;white-space:pre-line;font-size:15px;line-height:1.5">' + esc(r.Notizen) + '</p>' : '') +

  function openForm(r) {

      : { id: null, titel: '', untertitel: '', kategorie: '', portionen: '', vorbereitung: '', kochzeit: '', zutaten: '', zubereitung: '', notizen: '', naehrwerte: '', tags: [], foto: '', neuesFoto: '', fotoWeg: false };

  }
  function capture() {

  }
  function formHtml() {
    const f = ui.form;
    setTimeout(hydrate, 0);
    const cats = R().map(function (x) { return x.Kategorie; }).concat(['Frühstück', 'Hauptgericht', 'Suppe', 'Salat', 'Snack', 'Dessert']).filter(function (c, i, a) { return c && a.indexOf(c) === i; });
    const num = function (id, label, v) { return '<div>' + field(id, label, '<input id="' + id + '" class="input" type="number" min="0" inputmode="numeric" value="' + esc(v) + '" data-fresh>') + '</div>'; };
    const fotoNow = f.neuesFoto ? '<span class="rphoto"><img src="' + f.neuesFoto + '" alt=""></span>' : (f.foto && !f.fotoWeg ? photo({ Foto: f.foto }) : '');

      field('rz-zut', 'Zutaten (eine pro Zeile · Gruppen mit Doppelpunkt, z. B. „Suppe:“)', '<textarea id="rz-zut" class="input" rows="8" placeholder="Suppe:&#10;500 g Rote Bete&#10;2 rote Zwiebeln&#10;Topping:&#10;100 ml Sahne" data-fresh>' + esc(f.zutaten) + '</textarea>') +
      field('rz-zub', 'Zubereitung (ein Schritt pro Zeile)', '<textarea id="rz-zub" class="input" rows="7" data-fresh>' + esc(f.zubereitung) + '</textarea>') +

  function setHave(r, i, on) {
    r.Vorrat = (r.Vorrat || []).filter(function (x) { return x !== i; }); if (on) r.Vorrat.push(i);

  MINERVA.register('vesta/rezepte', {
    info: function () { const n = R().length; return n + ' Rezept' + (n === 1 ? '' : 'e'); },
    render: function () { const r = ui.open && byId(ui.open); return r ? detailView(r) : listView(); }
  });

  Object.assign(MINERVA.actions, {
    'rz.have': function (ds, el) {
      ui.have = el.value; MINERVA.render();
      const n = document.getElementById('rz-have'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); }

    'rz.cat': function (ds) { ui.cat = ds.v || ''; MINERVA.render(); },

    'rz.close': function () { ui.open = null; MINERVA.render(); },
    'rz.random': function () {

      if (!pool.length) { MINERVA.toast('Noch keine passenden Rezepte.'); return; }

    'rz.tag': function (ds) { const k = ui.tags.indexOf(ds.v); if (k > -1) ui.tags.splice(k, 1); else ui.tags.push(ds.v); MINERVA.render(); },
    'rz.ftag': function (ds) { capture(); const t = ui.form.tags, k = t.indexOf(ds.v); if (k > -1) t.splice(k, 1); else t.push(ds.v); MINERVA.renderModal(); },
    'rz.addtag': function () {

      if (!v) return; capture(); if (ui.form.tags.indexOf(v) < 0) ui.form.tags.push(v); MINERVA.renderModal();
    },
    'rz.have': function (ds) {
      const r = byId(ui.open); if (!r) return; const i = Number(ds.i);
      const on = (r.Vorrat || []).indexOf(i) < 0;
      setHave(r, i, on);
      if (on && listItem(r, i)) removeFromList([quelle(r, i)]);
      MINERVA.render();
    },
    'rz.havereset': function () {
      const r = byId(ui.open); if (!r) return; const pre = 'rz:' + r.ID + ':';
      r.Vorrat = []; D().items = D().items.filter(function (it) { return String(it.Quelle || '').indexOf(pre) !== 0; });
      MINERVA.render(); MINERVA.call('rezeptReset', [r.ID], 'vesta');
    },
    'rz.one': function (ds) {
      const r = byId(ui.open); if (!r) return; const i = Number(ds.i);
      if (listItem(r, i)) { removeFromList([quelle(r, i)]); MINERVA.render(); MINERVA.toast('Von der Einkaufsliste genommen.'); return; }
      if ((r.Vorrat || []).indexOf(i) > -1) setHave(r, i, false);
      addToList([i]);
    },
    'rz.tolist': function () {
      const r = byId(ui.open); if (!r) return;
      const have = r.Vorrat || [];
      addToList(r.Zutaten.map(function (z, i) { return i; }).filter(function (i) { return !isHead(r.Zutaten[i]) && have.indexOf(i) < 0 && !listItem(r, i); }));
    },
    'rz.new': function () { openForm(null); },
    'rz.edit': function () { const r = byId(ui.open); if (r) openForm(r); },
    'rz.pic': function (ds, el) {
      capture(); const file = el.files && el.files[0]; if (!file) return;
      shrink(file).then(function (u) { ui.form.neuesFoto = u; ui.form.fotoWeg = false; MINERVA.renderModal(); }).catch(function (e) { MINERVA.toast(e.message || String(e)); });
    },
    'rz.fotoweg': function () { capture(); ui.form.neuesFoto = ''; ui.form.fotoWeg = true; MINERVA.renderModal(); },
    'rz.save': function () {
      capture();

      const p = { id: f.id, titel: String(f.titel || '').trim(), untertitel: f.untertitel, kategorie: String(f.kategorie || '').trim(), portionen: f.portionen, vorbereitung: f.vorbereitung, kochzeit: f.kochzeit,

      if (!p.titel) { MINERVA.toast('Bitte einen Titel eingeben.'); return; }

        Dauer: (Number(p.vorbereitung) || 0) + (Number(p.kochzeit) || 0), Notizen: p.notizen, Naehrwerte: p.naehrwerte,
        Zutaten: String(p.zutaten).split('\n').map(function (z) { return z.trim(); }).filter(String), Zubereitung: p.zubereitung, Tags: p.tags, Vorrat: [],
        Foto: p.neuesFoto || p.fotoEntfernen ? '' : (f.foto || '') };
      if (p.neuesFoto) loc._pending = true;
      if (f.id) R().forEach(function (r) { if (r.ID === f.id) Object.assign(r, loc); });
      else { const id = 'tmp_' + Date.now(); D().rezepte.push(Object.assign({ ID: id }, loc)); }

      if (p.neuesFoto) MINERVA.toast('Wird gespeichert – Foto wird hochgeladen …');
      MINERVA.call('rezeptSave', [p], 'vesta').then(function (res) {
        if (res && !f.id) { const n = R().filter(function (r) { return r.Titel === p.titel; }).pop(); if (n) { ui.open = n.ID; MINERVA.render(); } }

        open: function () { ui.open = r.ID; MINERVA.go('vesta', 'rezepte'); } };

  });
})();

  <script>
/* VESTA · Wohnideen – Verbesserungsideen fürs Zuhause, nach Raum sortiert.
   Bewusst keine Aufgaben: erst wenn du willst, wird eine Idee mit einem Tipp zur JANUS-Aufgabe. */
(function () {
  const ui = { raum: '', form: null, showDone: false, coll: {} };
  const D = function () { return MINERVA.data.vesta; };
  const W = function () { return D().wohnideen || (D().wohnideen = []); };
  const RAEUME = ['Wohnzimmer', 'Küche', 'Bad', 'Schlafzimmer', 'Arbeitszimmer', 'Flur', 'Balkon'];
  const STATUS = [['idee', 'Idee'], ['geplant', 'Geplant'], ['erledigt', 'Erledigt']];
  const rooms = function () { return RAEUME.concat(W().map(function (w) { return w.Raum; })).filter(function (r, i, a) { return r && a.indexOf(r) === i; }); };

  const onList = function (w) { return ((D().items) || []).some(function (i) { return i.Quelle === 'wi:' + w.ID; }); };
  const asTask = function (w) { return ((MINERVA.data.janus || {}).aufgaben || []).some(function (a) { return a.Quelle === 'wi:' + w.ID; }); };
  /* Zeile: links „umgesetzt“, rechts Aufgabe · Einkaufsliste · bearbeiten */
  function row(w) {
    const done = w.Status === 'erledigt', list = onList(w), task = asTask(w);
    const meta = [w.Kosten, w.Notiz].filter(Boolean).join(' · ');
    return '<div class="irow' + (done ? ' done' : '') + '"><span class="duo"><button class="tog' + (done ? ' on' : '') + '" data-act="wi.done" data-id="' + esc(w.ID) + '" aria-pressed="' + done + '" aria-label="' + esc(w.Titel) + ' umgesetzt" title="Umgesetzt">' + ic('check', 15, 3) + '</button></span>' +
      '<button class="row" data-act="wi.edit" data-id="' + esc(w.ID) + '" tabindex="-1" aria-hidden="true"><span class="txt"><span class="name">' + esc(w.Titel) + '</span>' +
        (meta || task || list ? '<span class="meta">' + (task ? '<span class="duebadge">' + ic('tasks', 11) + ' Aufgabe</span> ' : '') + (list ? '<span class="duebadge">' + ic('cart', 11) + ' Einkaufsliste</span> ' : '') + esc(meta.slice(0, 80)) + '</span>' : '') + '</span></button>' +
      (done ? '' : (MINERVA.isActive('janus') ? '<button class="tog' + (task ? ' on' : '') + '" data-act="wi.task" data-id="' + esc(w.ID) + '" aria-pressed="' + task + '" aria-label="' + esc(w.Titel) + (task ? ' ist schon eine Aufgabe' : ' als Aufgabe übernehmen') + '" title="Als Aufgabe übernehmen">' + ic('tasks', 15) + '</button>' : '') +
        '<button class="tog cart' + (list ? ' on' : '') + '" data-act="wi.buy" data-id="' + esc(w.ID) + '" aria-pressed="' + list + '" aria-label="' + esc(w.Titel) + (list ? ' von der Einkaufsliste nehmen' : ' auf die Einkaufsliste') + '" title="Einkaufsliste">' + ic('cart', 15, 2) + '</button>') +
      '<button class="iconbtn sm" data-act="wi.edit" data-id="' + esc(w.ID) + '" aria-label="' + esc(w.Titel) + ' bearbeiten">' + ic('pen', 18) + '</button></div>';
  }

  function openForm(w) {
    ui.form = w ? { id: w.ID, titel: w.Titel, raum: w.Raum, notiz: w.Notiz, kosten: w.Kosten, link: w.Link, status: w.Status }
      : { id: null, titel: '', raum: ui.raum || '', notiz: '', kosten: '', link: '', status: 'idee' };
    MINERVA.openModal(function () {
      const f = ui.form;
      return '<h2 class="mtitle">' + (f.id ? 'Wohnidee bearbeiten' : 'Neue Wohnidee') + '</h2>' +
        field('wi-t', 'Idee', '<input id="wi-t" class="input" value="' + esc(f.titel) + '" placeholder="z. B. Lampe über dem Esstisch tauschen" autocomplete="off" data-fresh>') +
        '<span class="flabel">Raum</span><div class="chips">' + rooms().map(function (r) { return '<button class="chip" data-act="wi.fraum" data-v="' + esc(r) + '" aria-pressed="' + (f.raum === r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
        '<div class="inline"><label class="sr" for="wi-r">Anderer Raum</label><input id="wi-r" class="input" style="min-height:42px" placeholder="Anderer Raum …" value="' + esc(rooms().indexOf(f.raum) > -1 ? '' : f.raum) + '" autocomplete="off" data-fresh></div>' +
        '<div class="grid2"><div>' + field('wi-k', 'Kosten (optional)', '<input id="wi-k" class="input" value="' + esc(f.kosten) + '" placeholder="z. B. ca. 120 €" autocomplete="off" data-fresh>') + '</div>' +
        '<div>' + field('wi-l', 'Link (optional)', '<input id="wi-l" class="input" type="url" value="' + esc(f.link) + '" placeholder="https://…" autocomplete="off" data-fresh>') + '</div></div>' +
        field('wi-n', 'Notiz (optional)', '<textarea id="wi-n" class="input" rows="3" placeholder="Maße, Farbe, Idee dahinter …" data-fresh>' + esc(f.notiz) + '</textarea>') +
        '<span class="flabel">Status</span><div class="seg">' + STATUS.map(function (x) { return '<button data-act="wi.fstat" data-v="' + x[0] + '" aria-pressed="' + (f.status === x[0]) + '">' + x[1] + '</button>'; }).join('') + '</div>' +
        '<div class="grid2"><button class="btn ghost" data-act="modal.close">Abbrechen</button><button class="btn" data-act="wi.save">Speichern</button></div>' +
        (f.id ? '<button class="btn ghost sm center" data-act="wi.del">' + ic('trash', 16) + ' Löschen</button>' : '');
    });
  }
  function cap() {
    const f = ui.form; if (!f) return; const g = function (id) { const n = document.getElementById(id); return n ? n.value : null; };

    const r = g('wi-r'); if (r && r.trim()) f.raum = r.trim();
  }
  function save(w, patch) {
    Object.assign(w, patch);
    MINERVA.call('wohnideeSave', [{ id: w.ID, titel: w.Titel, raum: w.Raum, notiz: w.Notiz, kosten: w.Kosten, link: w.Link, status: w.Status }], 'vesta');
  }

  MINERVA.register('vesta/wohnideen', {
    info: function () { const n = W().filter(function (w) { return w.Status !== 'erledigt'; }).length; return n + ' Idee' + (n === 1 ? '' : 'n') + ' fürs Zuhause'; },
    render: function () {

  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const today = function () { return ymd(new Date().toISOString()); };
  const yearOf = function (d) { return /^\d{4}/.test(d || '') ? Number(d.slice(0, 4)) : null; };

  function fmt(d) {
    if (!d) return '';
    if (d === 'laufend') return 'heute';
    const p = d.split('-');
    if (p.length === 1) return p[0];
    if (p.length === 2) return MONTHS[Number(p[1]) - 1] + ' ' + p[0];
    return Number(p[2]) + '. ' + MONTHS[Number(p[1]) - 1] + ' ' + p[0];
  }
  function range(e) {
    if (!e.DatumBis) return fmt(e.Datum);
    if (e.DatumBis === 'laufend') return 'seit ' + fmt(e.Datum);
    return fmt(e.Datum) + ' – ' + fmt(e.DatumBis);
  }
  function years(e) {
    const a = yearOf(e.Datum); if (a === null) return [];
    const b = e.DatumBis === 'laufend' ? new Date().getFullYear() : (yearOf(e.DatumBis) || a);
    const out = []; for (let y = a; y <= Math.max(a, b); y++) out.push(y); return out;
  }
  function onThisDay() {
    const t = today().slice(5), y = Number(today().slice(0, 4));
    return D().entries.filter(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.Datum) && e.Datum.slice(5) === t && yearOf(e.Datum) < y; });
  }

  /* ---------- Fotos ---------- */
  MINERVA.photoCache = MINERVA.photoCache || {};
  function photoTile(id, removable) {
    const src = MINERVA.photoCache[id];
    return '<span class="ptile">' + (src ? '<img src="' + src + '" alt="">' : '<span class="pload" data-photo="' + esc(id) + '">' + ic('image', 22) + '</span>') +
      (removable ? '<button class="pdel" data-act="clio.fdel" data-id="' + esc(id) + '" aria-label="Foto entfernen">' + ic('x', 14, 2.4) + '</button>' : '') + '</span>';
  }
  function hydrate() {
    document.querySelectorAll('[data-photo]').forEach(function (n) {
      const id = n.getAttribute('data-photo'); if (n._loading) return; n._loading = true;
      MINERVA.api('clioPhoto', id).then(function (url) {
        MINERVA.photoCache[id] = url;
        document.querySelectorAll('[data-photo="' + id + '"]').forEach(function (m) { m.outerHTML = '<img src="' + url + '" alt="">'; });
      }).catch(function () { n.innerHTML = '<span class="small">nicht verfügbar</span>'; });
    });
  }
  function shrink(file, max) {
    return new Promise(function (res, rej) {
      const fr = new FileReader();
      fr.onerror = function () { rej(new Error('Foto konnte nicht gelesen werden.')); };
      fr.onload = function () {
        const img = new Image();
        img.onerror = function () { rej(new Error('Dieses Bildformat wird nicht unterstützt.')); };
        img.onload = function () {
          const sc = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.85));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  /* ---------- Formular ---------- */
  function precisionOf(d) { return !d ? 'tag' : (d.length === 4 ? 'jahr' : (d.length === 7 ? 'monat' : 'tag')); }
  function dateInput(id, prec, value) {
    if (prec === 'jahr') return '<input id="' + id + '" class="input" type="number" inputmode="numeric" min="1900" max="2100" placeholder="JJJJ" value="' + esc(value ? value.slice(0, 4) : '') + '">';
    if (prec === 'monat') return '<input id="' + id + '" class="input" type="month" value="' + esc(value ? value.slice(0, 7) : '') + '">';
    return '<input id="' + id + '" class="input" type="date" value="' + esc(value && value.length === 10 ? value : (value ? '' : '')) + '">';
  }
  function readDate(id, prec) {
    const v = (document.getElementById(id) || {}).value || '';
    if (prec === 'jahr') return /^\d{4}$/.test(v) ? v : '';
    if (prec === 'monat') return /^\d{4}-\d{2}$/.test(v) ? v : '';
    return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  }
  function captureForm() {

    const g = function (id) { const n = document.getElementById(id); return n ? n.value : undefined; };
    if (g('clio-titel') !== undefined) f.titel = g('clio-titel');
    if (g('clio-ort') !== undefined) f.ort = g('clio-ort');
    if (g('clio-text') !== undefined) f.beschreibung = g('clio-text');

    const d2 = g('clio-bis'); if (d2 !== undefined && f.bisOn && !f.laufend) f.datumBis = readDate('clio-bis', f.prec) || f.datumBis;
    kat(f.kategorie).fields.forEach(function (x, i) { const v = g('clio-d-' + i); if (v !== undefined) f.details[x[0]] = v; });
  }
  function openForm(e, prefill) {
    const base = e ? { id: e.ID, titel: e.Titel, kategorie: e.Kategorie, datum: e.Datum, datumBis: e.DatumBis === 'laufend' ? '' : e.DatumBis, laufend: e.DatumBis === 'laufend', bisOn: !!e.DatumBis, ort: e.Ort, beschreibung: e.Beschreibung, details: Object.assign({}, e.Details), fotos: e.Fotos.slice(), personen: (e.Personen || []).slice() }

    ui.form = base;

  }
  function formHtml() {

      '<div>' + (f.bisOn ? field('clio-bis', 'Bis', f.laufend ? '<div class="input" style="display:flex;align-items:center;color:var(--ink-2)">heute (läuft noch)</div>' : dateInput('clio-bis', f.prec, f.datumBis).replace('<input', '<input data-fresh')) : '') + '</div></div>' +
      '<div class="chips"><button class="chip" data-act="clio.fbis" aria-pressed="' + f.bisOn + '">' + ic('calendar', 16) + ' Zeitraum</button>' +

          return '<button class="chip" data-act="clio.fopt" data-i="0" data-v="' + esc(o) + '" aria-pressed="' + ((f.details[x[0]] || '') === o) + '">' + esc(o) + '</button>';
        }).join('') + '</div>' : '';
        return field('clio-d-' + i, x[1] + ' (optional)', opts + '<input id="clio-d-' + i + '" class="input" value="' + esc(f.details[x[0]] || '') + '" autocomplete="off" data-fresh>');
      }).join('') +

        return '<button class="chip" data-act="clio.fperson" data-v="' + esc(pp.ID) + '" aria-pressed="' + (f.personen.indexOf(pp.ID) > -1) + '">' + ic('user', 14) + ' ' + esc(pp.Name) + '</button>';

  }
  /* Termine aus „Menschen“ (Geburtstage, Jahrestage mit bekanntem Jahr) als Einträge in der Chronik */
  function harmoniaEntries() {
    if (ui.showH === false || !MINERVA.isActive('clio') || !MINERVA.data.harmonia) return [];
    const h = MINERVA.data.harmonia, out = [];
    h.personen.forEach(function (p) { if (/^\d{4}-\d{2}-\d{2}$/.test(p.Geburtstag)) out.push({ virtual: true, pid: p.ID, Datum: p.Geburtstag, Titel: 'Geburt von ' + p.Name, sub: 'Geburtstag · ' + (p.Beziehung || 'Menschen'), icon: 'cake' }); });
    h.anlaesse.forEach(function (a) {
      if (!a.InClio || !/^\d{4}-\d{2}-\d{2}$/.test(a.Datum)) return;
      out.push({ virtual: true, pid: a.PersonID, Datum: a.Datum, Titel: a.Titel, sub: a.Art + (personName(a.PersonID) ? ' · ' + personName(a.PersonID) : ''), icon: 'harmonia' });
    });
    return out;
  }
  function virtualBtn(v) {
    return '<button class="tlitem" data-act="hm.openperson" data-id="' + esc(v.pid) + '"><span class="cicon t-gruen">' + ic(v.icon, 18) + '</span>' +
      '<span class="txt"><span class="small">' + esc(fmt(v.Datum)) + ' · ' + esc(v.sub) + '</span><b>' + esc(v.Titel) + '</b></span><span class="badge grau" style="margin-left:auto">Menschen</span></button>';
  }
  function chronikView() {
    const list = D().entries.filter(function (e) { return !ui.kat || e.Kategorie === ui.kat; }).concat(ui.kat ? [] : harmoniaEntries())
      .sort(function (a, b) { return String(b.Datum).localeCompare(String(a.Datum)); });

    'clio.new': function () { openForm(null); },
    'clio.open': function (ds) { ui.detail = ds.id; MINERVA.openModal(detailHtml); },
    'clio.edit': function (ds) { const e = D().entries.filter(function (x) { return x.ID === ds.id; })[0]; if (e) openForm(e); },
    'clio.fopt': function (ds) { captureForm(); const k = kat(ui.form.kategorie), key = (k.fields[Number(ds.i)] || [])[0]; if (!key) return; ui.form.details[key] = ui.form.details[key] === ds.v ? '' : ds.v; MINERVA.renderModal(); },
    'clio.fperson': function (ds) { captureForm(); const l = ui.form.personen, i = l.indexOf(ds.v); if (i > -1) l.splice(i, 1); else l.push(ds.v); MINERVA.renderModal(); },
    'ck.new': function (ds, el, e) { openKat(null); },
    'ck.edit': function (ds, el, e) { if (e) e.stopPropagation(); const k = (D().kategorien || []).filter(function (x) { return x.ID === ds.id; })[0]; if (k) openKat(k); },
    'ck.ficon': function (ds) { kcap(); ui.ck.icon = ds.v; MINERVA.renderModal(); },
    'ck.ffarbe': function (ds) { kcap(); ui.ck.farbe = ds.v; MINERVA.renderModal(); },
    'ck.save': function () {
      kcap(); const k = ui.ck; if (!k.name.trim()) { MINERVA.toast('Bitte einen Namen eingeben.'); return; }
