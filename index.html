      const loc = { Name: k.name.trim(), Icon: k.icon, Farbe: k.farbe, OrtLabel: k.ortLabel.trim() || 'Ort', Felder: list(k.felder), Optionen: list(k.optionen) };
      if (k.id) D().kategorien.forEach(function (x) { if (x.ID === k.id) Object.assign(x, loc); });
      else D().kategorien.push(Object.assign({ ID: 'tmp_' + Date.now() }, loc));
      MINERVA.closeModal(); MINERVA.render();
      MINERVA.call('clioKatSave', [{ id: k.id, name: loc.Name, icon: k.icon, farbe: k.farbe, ortLabel: loc.OrtLabel, felder: loc.Felder.join(', '), optionen: loc.Optionen.join(', ') }], 'clio');
    },
    'ck.del': function () {
      const k = ui.ck; if (!k || !k.id) return;
      MINERVA.confirmDelete({ simple: true, title: 'Kategorie „' + k.name + '“ löschen?', text: 'Das geht nur, wenn kein Eintrag sie mehr nutzt.', onConfirm: function () {
        D().kategorien = D().kategorien.filter(function (x) { return x.ID !== k.id; }); MINERVA.render(); MINERVA.call('clioKatDelete', [k.id], 'clio');
      } });
    },
    'clio.fkat': function (ds) { captureForm(); ui.form.kategorie = ds.v; MINERVA.renderModal(); },
    'clio.fprec': function (ds) {
      captureForm(); const f = ui.form; f.prec = ds.v;
      const fit = function (d) {
        if (!d) return '';
        if (ds.v === 'jahr') return d.slice(0, 4);
        if (ds.v === 'monat') return d.length >= 7 ? d.slice(0, 7) : d.slice(0, 4) + '-01';
        return d.length === 10 ? d : (d.length === 7 ? d + '-01' : d.slice(0, 4) + '-01-01');
      };
      f.datum = fit(f.datum || today()); f.datumBis = fit(f.datumBis); MINERVA.renderModal();
    },
    'clio.fbis': function () { captureForm(); ui.form.bisOn = !ui.form.bisOn; if (!ui.form.bisOn) { ui.form.datumBis = ''; ui.form.laufend = false; } MINERVA.renderModal(); },
    'clio.flauf': function () { captureForm(); ui.form.laufend = !ui.form.laufend; MINERVA.renderModal(); },
    'clio.fpic': function (ds, el) {
      captureForm();
      const files = Array.prototype.slice.call(el.files || []);
      const room = 6 - (ui.form.fotos.length - ui.form.weg.length) - ui.form.neu.length;
      Promise.all(files.slice(0, Math.max(0, room)).map(function (f) { return shrink(f, 1600); })).then(function (urls) {

    'clio.fdel': function (ds) { captureForm(); ui.form.weg.push(ds.id); MINERVA.renderModal(); },
    'clio.fnewdel': function (ds) { captureForm(); ui.form.neu.splice(Number(ds.i), 1); MINERVA.renderModal(); },
    'clio.save': function () {
      captureForm();
      const f = ui.form;
      const datum = readDate('clio-von', f.prec);
      const bis = f.bisOn ? (f.laufend ? 'laufend' : readDate('clio-bis', f.prec)) : '';
      if (!f.titel.trim()) { MINERVA.toast('Bitte einen Titel eingeben.'); return; }
      if (!datum) { MINERVA.toast(f.prec === 'jahr' ? 'Bitte ein Jahr eingeben.' : 'Bitte ein Datum wählen.'); return; }
      const details = {}; kat(f.kategorie).fields.forEach(function (x) { if ((f.details[x[0]] || '').trim()) details[x[0]] = f.details[x[0]].trim(); });
      Object.keys(f.details).forEach(function (k) { if (!(k in details) && (f.details[k] || '').trim() && !kat(f.kategorie).fields.some(function (x) { return x[0] === k; })) details[k] = f.details[k]; });
      const p = { id: f.id, titel: f.titel.trim(), kategorie: f.kategorie, datum: datum, datumBis: bis, ort: f.ort, beschreibung: f.beschreibung, details: details, personen: f.personen.slice(), neueFotos: f.neu, entfernteFotos: f.weg };
      const loc = { Titel: p.titel, Kategorie: p.kategorie, Datum: datum, DatumBis: bis, Ort: p.ort, Beschreibung: p.beschreibung, Details: details, Personen: p.personen, Fotos: f.fotos.filter(function (id) { return f.weg.indexOf(id) < 0; }) };
      const d = D();
      if (f.id) d.entries.forEach(function (e) { if (e.ID === f.id) Object.assign(e, loc); });

      d.entries.sort(function (a, b) { return String(b.Datum).localeCompare(String(a.Datum)); });
      MINERVA.closeModal(); MINERVA.render();
      if (f.neu.length) MINERVA.toast('Wird gespeichert – Fotos werden hochgeladen …');
      MINERVA.call('clioSave', [p], 'clio').then(function (r) { if (r && f.neu.length) MINERVA.toast('Gespeichert.'); });
    },
    'clio.del': function (ds) {
      const e = D().entries.filter(function (x) { return x.ID === ds.id; })[0]; if (!e) return;
      MINERVA.confirmDelete({ title: '„' + e.Titel + '“ löschen?', text: 'Der Eintrag und seine Fotos verschwinden dauerhaft aus deiner Chronik.', onConfirm: function () {
        D().entries = D().entries.filter(function (x) { return x.ID !== e.ID; }); MINERVA.render(); MINERVA.call('clioDelete', [e.ID], 'clio');
      } });
    }
  });

  MINERVA.searchProviders.push(function (q) {
    return D().entries.filter(function (e) {
      return MINERVA.matches(q, [e.Titel, e.Ort, e.Beschreibung, kat(e.Kategorie).name, Object.keys(e.Details || {}).map(function (k) { return e.Details[k]; }).join(' '), e.Datum]);
    }).map(function (e) {
      return { title: e.Titel, meta: kat(e.Kategorie).name, date: range(e), modName: 'CLIO', icon: 'clio',
        open: function () { MINERVA.go('clio', 'chronik'); ui.detail = e.ID; MINERVA.openModal(detailHtml); } };
    });
  });

  /* Startseite: Erinnerungen ±n Tage um heute (frühere Jahre) und geplante Einträge der nächsten Tage */
  const dayDiff = function (a, b) { return Math.round((a - b) / 86400000); };
  const mid = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
  MINERVA.clioMemories = function (win) {
    const now = mid(new Date()), y = now.getFullYear(), out = [];
    D().entries.forEach(function (e) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(e.Datum)) return;
      const p = e.Datum.split('-').map(Number); if (p[0] >= y) return;
      [y - 1, y, y + 1].forEach(function (yy) {
        const d = new Date(yy, p[1] - 1, p[2]), diff = dayDiff(d, now);
        if (Math.abs(diff) <= win) out.push({ e: e, years: yy - p[0], diff: diff, when: relDays(diff) + ' · ' + fmt(e.Datum) });
      });
    });
    return out.filter(function (x) { return x.years > 0; }).sort(function (a, b) { return Math.abs(a.diff) - Math.abs(b.diff); });
  };
  MINERVA.upcomingProviders.push(function (days) {
    const now = mid(new Date());
    return D().entries.filter(function (e) { return /^\d{4}-\d{2}-\d{2}$/.test(e.Datum); }).map(function (e) {
      const p = e.Datum.split('-').map(Number); return { e: e, diff: dayDiff(new Date(p[0], p[1] - 1, p[2]), now) };
    }).filter(function (x) { return x.diff >= 0 && x.diff <= days; }).map(function (x) {
      const k = kat(x.e.Kategorie);
      return { mod: 'clio', act: 'clio.openhome', id: x.e.ID, icon: k.icon, tint: k.tint, title: x.e.Titel, days: x.diff, when: relDays(x.diff) + ' · ' + range(x.e) };
    });
  });
  MINERVA.actions['clio.openhome'] = function (ds) { ui.detail = ds.id; MINERVA.openModal(detailHtml); };
})();
</script>

      const p = { id: f.id, titel: t, kategorie: f.kategorie, horizont: f.horizont, notiz: document.getElementById('w-notiz').value };
      if (f.id) L().forEach(function (w) { if (w.ID === f.id) Object.assign(w, { Titel: t, Kategorie: p.kategorie, Horizont: p.horizont, Notiz: p.notiz }); });

      MINERVA.render(); MINERVA.toast('Erfüllt! Wie schön.'); MINERVA.call('bucketFulfill', [ds.id, true], 'clio');

    'w.undo': function (ds) { L().forEach(function (w) { if (w.ID === ds.id) { w.Status = 'offen'; w.Erfuellt = ''; } }); MINERVA.render(); MINERVA.call('bucketFulfill', [ds.id, false], 'clio'); },
    'w.clio': function (ds) {

      MINERVA.go('clio', 'chronik');
      MINERVA.clioNew({ titel: w.Titel, kategorie: w.Kategorie === 'Reisen & Orte' ? 'reise' : 'meilenstein', datum: w.Erfuellt || ymd(new Date().toISOString()), beschreibung: w.Notiz || '' });
    }
  });

  MINERVA.searchProviders.push(function (q) {
    return L().filter(function (w) { return MINERVA.matches(q, [w.Titel, w.Notiz, w.Kategorie]); }).map(function (w) {
      return { title: w.Titel, meta: 'Bucket List' + (w.Status === 'erfuellt' ? ' · erfüllt' : ''), modName: 'CLIO', icon: 'star', open: function () { MINERVA.go('clio', 'wuensche'); } };
    });
  });
})();

  <script>
/* CLIO · Menschen (früher HARMONIA) – Profile mit Geburtstag (Alter), Adresse, Vorlieben, Interessen, Notizen und Anlässen.
   Anstehende Anlässe erscheinen mit Vorlauf auf der Startseite („Demnächst“). */
(function () {
  const ui = { open: null, q: '', pform: null, aform: null };
  const H = function () { return MINERVA.data.harmonia; };
  const P = function () { return H().personen || []; };
  const byId = function (id) { return P().filter(function (p) { return p.ID === id; })[0]; };
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const BEZ = ['Familie', 'Partner:in', 'Freund:in', 'Kolleg:in', 'Bekannte'];
  const ARTEN = ['Jahrestag', 'Hochzeitstag', 'Jubiläum', 'Namenstag', 'Sonstiges'];
  const GRADS = ['g-janus', 'g-vesta', 'g-blau', 'g-clio', 'g-harmonia'];
  const grad = function (name) { let h = 0; String(name).split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) % 997; }); return GRADS[h % GRADS.length]; };
  const initials = function (n) { return String(n).split(/\s+/).filter(function (w) { return /^[A-Za-zÄÖÜäöüß]/.test(w); }).slice(0, 2).map(function (w) { return w.charAt(0).toUpperCase(); }).join('') || '?'; };
  const mid = function (d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

  /* Datum: JJJJ-MM-TT oder --MM-TT (Jahr unbekannt) */
  function md(d) { const p = String(d || '').split('-'); return p.length === 3 ? [Number(p[1]), Number(p[2])] : (String(d).indexOf('--') === 0 ? [Number(p[2]), Number(p[3])] : null); }
  function parts(d) { const m = /^(\d{4}|-)-?(\d{2})-(\d{2})$/.exec(String(d || '').replace(/^--/, '-')); if (!m) return null; return { y: m[1] === '-' ? null : Number(m[1]), m: Number(m[2]), d: Number(m[3]) }; }
  function nextOcc(d) {
    const p = parts(d); if (!p) return null;
    const t = mid(new Date()); let n = new Date(t.getFullYear(), p.m - 1, p.d); if (n < t) n = new Date(t.getFullYear() + 1, p.m - 1, p.d);
    return { date: n, days: Math.round((n - t) / 86400000), years: p.y ? n.getFullYear() - p.y : null };
  }
  function ageOf(p) {
    const x = parts(p.Geburtstag); if (!x || !x.y) return null;
    const t = new Date(); let a = t.getFullYear() - x.y; if (t.getMonth() + 1 < x.m || (t.getMonth() + 1 === x.m && t.getDate() < x.d)) a--; return a;
  }
  function fmtMD(d) { const p = parts(d); return p ? p.d + '. ' + MONTHS[p.m - 1] + (p.y ? ' ' + p.y : '') : ''; }
  const when = function (n) { return relDays(n.days) + ' · ' + n.date.getDate() + '. ' + MONTHS[n.date.getMonth()]; };
  MINERVA.hmAge = ageOf; MINERVA.hmNext = nextOcc;

  /* Anstehende Anlässe einer Person (Geburtstag + eigene Anlässe), sortiert */
  function occasions(p) {
    const out = [];
    const b = nextOcc(p.Geburtstag);
    if (b) out.push({ kind: 'geb', title: p.Name + (b.years ? ' wird ' + b.years : ' hat Geburtstag'), icon: 'cake', n: b, vorlauf: 30 });
    (H().anlaesse || []).filter(function (a) { return a.PersonID === p.ID; }).forEach(function (a) {
      const n = nextOcc(a.Datum); if (n) out.push({ kind: 'an', a: a, title: a.Titel + (n.years ? ' (' + n.years + '.)' : ''), icon: 'harmonia', n: n, vorlauf: a.Vorlauf || 21 });
    });
    return out.sort(function (x, y) { return x.n.days - y.n.days; });
  }

  /* ---------- Formulare ---------- */
  function dateFields(prefix, value) {
    const p = parts(value), unk = p && !p.y;
    const v = p ? (p.y || 2000) + '-' + String(p.m).padStart(2, '0') + '-' + String(p.d).padStart(2, '0') : '';
    return '<input id="' + prefix + '" class="input" type="date" value="' + esc(v) + '" data-fresh>' +
      '<div class="chips"><button class="chip" data-act="hm.unk" data-f="' + prefix + '" aria-pressed="' + !!unk + '">Jahr unbekannt</button></div>';
  }
  function readDate(prefix, unk) {
    const v = (document.getElementById(prefix) || {}).value || '';

  }
  function openPerson(p) {

        field('hp-vor', 'Vorlieben (optional)', '<textarea id="hp-vor" class="input" rows="2" placeholder="z. B. mag dunkle Schokolade, trinkt keinen Kaffee" data-fresh>' + esc(f.vorlieben) + '</textarea>') +
        field('hp-int', 'Interessen (optional)', '<textarea id="hp-int" class="input" rows="2" placeholder="z. B. Wandern, Jazz, Fotografie" data-fresh>' + esc(f.interessen) + '</textarea>') +
        field('hp-not', 'Wichtige Notizen (optional)', '<textarea id="hp-not" class="input" rows="3" data-fresh>' + esc(f.notizen) + '</textarea>') +
        '<div class="grid2"><button class="btn ghost" data-act="modal.close">Abbrechen</button><button class="btn" data-act="hm.psave">Speichern</button></div>' +
        (f.id ? '<button class="btn ghost sm center" data-act="hm.pdel">' + ic('trash', 16) + ' Person löschen</button>' : '');
    });
  }
  function pcap() {
    const f = ui.pform; if (!f) return; const g = function (id) { const n = document.getElementById(id); return n ? n.value : null; };
    [['name', 'hp-name'], ['adresse', 'hp-adr'], ['vorlieben', 'hp-vor'], ['interessen', 'hp-int'], ['notizen', 'hp-not']].forEach(function (x) { const v = g(x[1]); if (v !== null) f[x[0]] = v; });
    const d = g('hp-geb'); if (d !== null) f.geb = /^\d{4}-\d{2}-\d{2}$/.test(d) ? (f.unk ? '--' + d.slice(5) : d) : '';
  }
  function openAnlass(a, pid) {
    ui.aform = a ? { id: a.ID, pid: a.PersonID, titel: a.Titel, art: a.Art, datum: a.Datum, unk: !!(parts(a.Datum) && !parts(a.Datum).y), vorlauf: a.Vorlauf, inClio: a.InClio, notiz: a.Notiz }
      : { id: null, pid: pid, titel: '', art: 'Jahrestag', datum: '', unk: false, vorlauf: 21, inClio: true, notiz: '' };
    MINERVA.openModal(function () {
      const f = ui.aform;
      return '<h2 class="mtitle">' + (f.id ? 'Anlass bearbeiten' : 'Neuer Anlass') + '</h2>' +
        field('ha-titel', 'Titel', '<input id="ha-titel" class="input" value="' + esc(f.titel) + '" placeholder="z. B. Hochzeitstag Anna & Tom" autocomplete="off" data-fresh>') +
        '<span class="flabel">Art</span><div class="chips">' + ARTEN.map(function (x) { return '<button class="chip" data-act="hm.aart" data-v="' + x + '" aria-pressed="' + (f.art === x) + '">' + x + '</button>'; }).join('') + '</div>' +
        field('ha-datum', 'Datum (wiederholt sich jährlich)', dateFields('ha-datum', f.datum).replace(/aria-pressed="(true|false)"/, 'aria-pressed="' + f.unk + '"')) +
        '<div class="grid2"><div>' + field('ha-vor', 'Vorlauf (Tage)', '<input id="ha-vor" class="input" type="number" min="1" max="120" value="' + esc(f.vorlauf) + '" data-fresh>') + '</div>' +
        '<div><span class="flabel">In CLIO anzeigen</span><div class="chips"><button class="chip" data-act="hm.aclio" aria-pressed="' + f.inClio + '">' + ic('clio', 14) + (f.inClio ? ' Ja' : ' Nein') + '</button></div></div></div>' +
        field('ha-not', 'Notiz (optional)', '<textarea id="ha-not" class="input" rows="2" data-fresh>' + esc(f.notiz) + '</textarea>') +
        '<div class="grid2"><button class="btn ghost" data-act="modal.close">Abbrechen</button><button class="btn" data-act="hm.asave">Speichern</button></div>' +
        (f.id ? '<button class="btn ghost sm center" data-act="hm.adel">' + ic('trash', 16) + ' Anlass löschen</button>' : '');

  function acap() {

  <script>

          '<button class="btn ghost sm center" data-act="hm.openperson" data-id="' + esc(f) + '">' + ic('users', 16) + ' Profil von ' + esc(pname(f)) + '</button>';

        }).join('') || '<div class="panel"><p class="empty">Noch keine Geschenkideen. Notiere sie, sobald sie dir einfallen – dann sind sie da, wenn es so weit ist.</p></div>';
      }
      return topbar('CLIO', 'Geschenkideen') + '<div class="split"><div class="summary">' + summary + '</div><div class="stack">' + body + '</div></div>';

  Object.assign(MINERVA.actions, {

  <script>
/* MINERVA CORE – Profil & übergreifende Einstellungen. */
(function () {
  const S = function () { return MINERVA.data.settings || {}; };
  const FIELDS = [
    { k: 'NAME', label: 'Name', ph: 'Wie soll MINERVA dich nennen?' },
    { k: 'GEBURTSTAG', label: 'Geburtstag', type: 'date' },
    { k: 'MOTTO', label: 'Leitsatz', ph: 'Ein Satz, der dich begleitet' }
  ];
  const SETTINGS = [
    { k: 'ROUTINE_MORGEN_UHRZEIT', label: 'Routinen: Tag ab (Uhr)', min: 0, max: 23, def: 4 },
    { k: 'ROUTINE_WECHSEL_UHRZEIT', label: 'Routinen: Abend ab (Uhr)', min: 0, max: 23, def: 16 }
  ];
  const val = function (id) { const n = document.getElementById(id); return n ? n.value : ''; };

  /** Bild verkleinern (quadratisch zuschneiden) und als JPEG-Text liefern, klein genug für eine Tabellenzelle. */
  function shrink(file) {
    return new Promise(function (res, rej) {
      const fr = new FileReader();
      fr.onerror = function () { rej(new Error('Bild konnte nicht gelesen werden.')); };
      fr.onload = function () {
        const img = new Image();
        img.onerror = function () { rej(new Error('Dieses Bildformat wird nicht unterstützt.')); };
        img.onload = function () {
          let size = 256, q = 0.82, out = '';
          for (let i = 0; i < 6; i++) {
            const c = document.createElement('canvas'); c.width = c.height = size;
            const s = Math.min(img.width, img.height);
            c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
            out = c.toDataURL('image/jpeg', q);
            if (out.length < 45000) return res(out);
            size = Math.round(size * 0.85); q = Math.max(0.5, q - 0.08);
          }
          res(out);
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  MINERVA.upcomingProviders = MINERVA.upcomingProviders || [];
  MINERVA.upcomingProviders.push(function (days) {
    const b = ymd(S().GEBURTSTAG); if (!b) return [];
    const now = new Date(); const t = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const p = b.split('-').map(Number);
    let next = new Date(t.getFullYear(), p[1] - 1, p[2]); if (next < t) next = new Date(t.getFullYear() + 1, p[1] - 1, p[2]);
    const diff = Math.round((next - t) / 86400000); if (diff > days) return [];
    return [{ mod: 'core', act: 'nav.go', sub: 'profil', icon: 'star', tint: 't-lila', title: 'Dein Geburtstag', days: diff, when: relDays(diff) + ' · ' + fmtDate(next.toISOString(), { day: 'numeric', month: 'long' }) }];
  });

  MINERVA.register('core/profil', {
    render: function () {
      const s = S();
      const head = '<div class="card glass profilehead">' +
        '<div class="avwrap">' + avatar(112, 'big') +
          '<label class="avbtn" for="core-pic" title="Profilbild ändern">' + ic('camera', 18) + '<span class="sr">Profilbild ändern</span></label>' +
          '<input id="core-pic" type="file" accept="image/*" data-change="core.pic" class="sr"></div>' +
        '<div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span class="eyebrow">MINERVA CORE</span>' +
          '<h1 class="title">' + esc(s.NAME || 'Dein Profil') + '</h1>' +

          (s.MOTTO ? '<span class="small" style="font-style:italic">„' + esc(s.MOTTO) + '“</span>' : '') +
          (s.PROFILBILD ? '<button class="btn ghost sm" style="align-self:flex-start;margin-top:6px" data-act="core.picdel">Profilbild entfernen</button>' : '') +
        '</div></div>';
      const prof = '<section class="panel"><div class="sechead"><span class="cicon t-lila">' + ic('user') + '</span><h2>Profil</h2></div><div class="form">' +
        FIELDS.map(function (f) {
          return field('core-' + f.k, f.label, '<input id="core-' + f.k + '" class="input" type="' + (f.type || 'text') + '" value="' + esc(f.type === 'date' ? ymd(s[f.k]) : (s[f.k] || '')) + '" placeholder="' + esc(f.ph || '') + '" autocomplete="off">');
        }).join('') +
        '<button class="btn" data-act="core.save">Profil speichern</button></div></section>';
      const sett = '<section class="panel"><div class="sechead"><span class="cicon t-blau">' + ic('gear') + '</span><h2>Einstellungen</h2></div><div class="form">' +
        SETTINGS.map(function (f) {
          return field('core-' + f.k, f.label, '<input id="core-' + f.k + '" class="input" type="number" inputmode="numeric" min="' + f.min + '" max="' + f.max + '" value="' + esc(s[f.k] !== undefined && s[f.k] !== '' ? s[f.k] : f.def) + '">');
        }).join('') +
        '<button class="btn ghost" data-act="core.settings">Einstellungen speichern</button></div></section>';
      const act = MINERVA.activeModules().map(function (m) { return m.id; });
      const info = '<section class="panel"><div class="sechead"><span class="cicon t-petrol">' + ic('sparkle') + '</span><h2>Über MINERVA</h2><span class="count">Version ' + esc(MINERVA.data.version || '–') + '</span></div>' +
        '<p class="small" style="margin:0 12px 8px">Modular Intelligent Neural Executive &amp; Resource Virtual Assistant – dein persönliches System. Das Gegenstück für dein Zuhause ist ATLAS. Alle Inhalte liegen in deinem Google Sheet.</p>' +
        '<div class="wcat">Module</div>' + MINERVA.data.modules.map(function (m) {
          const on = act.indexOf(m.id) > -1;
          return '<div class="modstat"><span class="modicon sm g-' + m.id + '" style="width:42px;height:42px;border-radius:14px' + (on ? '' : ';filter:grayscale(1);opacity:.5') + '">' + ic(m.icon, 20) + '</span>' +
            '<span class="txt"><b style="font-weight:600;letter-spacing:.14em">' + esc(m.name) + '</b><span class="small">' + esc(m.desc) + ' · ' + (on ? 'aktiv' : 'ausgeblendet') + '</span></span>' +
            '<button class="switch" role="switch" aria-checked="' + on + '" aria-label="' + esc(m.name) + (on ? ' ausblenden' : ' aktivieren') + '" data-act="core.mod" data-id="' + m.id + '" data-on="' + on + '"></button></div>';
        }).join('') +
        '<div class="kv"><span>Version</span><span>' + esc(MINERVA.data.version || '–') + '</span><span>Datenbasis</span><span>Google Sheets · Apps Script' + (typeof MINERVA_APP !== 'undefined' ? ' · MINERVA-App' : '') + '</span></div></section>';
      const fb = MINERVA.data.feedback || [];
      const STAT = ['neu', 'geplant', 'erledigt', 'verworfen'];
      const ctxName = function (id) { const m = id && MINERVA.module(id); return m ? m.name : 'Allgemein'; };
      const ideas = '<section class="panel"><div class="sechead"><span class="cicon t-lila">' + ic('dump') + '</span><h2>Verbesserungsideen</h2><span class="count">' + fb.filter(function (f) { return f.Status === 'neu'; }).length + ' neu</span></div>' +
        (fb.length ? fb.map(function (f) {
          return '<div class="witem"><div class="txt" style="flex:1;min-width:0"><span style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge' + (f.Kategorie === 'Fehler' ? ' grau' : (f.Kategorie === 'Funktionswunsch' ? ' blau' : '')) + '">' + esc(f.Kategorie) + '</span><span class="badge grau">' + esc(ctxName(f.Kontext)) + '</span></span>' +
            '<b>' + esc(f.Titel) + '</b>' + (f.Beschreibung ? '<span class="small" style="white-space:pre-line">' + esc(f.Beschreibung) + '</span>' : '') + '</div>' +
            '<select class="input fbstat" aria-label="Status" data-change="core.fbstat" data-id="' + esc(f.ID) + '">' + STAT.map(function (st) { return '<option' + (st === f.Status ? ' selected' : '') + '>' + st + '</option>'; }).join('') + '</select></div>';
        }).join('') : '<p class="empty">Noch nichts eingereicht. Das ' + ic('dump', 14) + ' oben rechts geht von überall.</p>') + '</section>';
      const extra = (MINERVA.corePanels || []).map(function (f) { try { return f(); } catch (e) { console.error(e); return ''; } }).join('');
      return topbar('CORE', 'Profil') + '<div class="split"><div class="stack summary">' + head + info + '</div><div class="stack">' + prof + extra + ideas + sett + '</div></div>';
    }
  });

  Object.assign(MINERVA.actions, {
    'core.save': function () {
      const p = {};
      FIELDS.forEach(function (f) { p[f.k] = val('core-' + f.k).trim(); });
      Object.assign(MINERVA.data.settings, p); MINERVA.render();
      MINERVA.call('profilSave', [p], 'settings').then(function (d) { if (d) MINERVA.toast('Profil gespeichert.'); });
    },
    'core.settings': function () {
      const p = {};
      SETTINGS.forEach(function (f) { p[f.k] = val('core-' + f.k); });
      MINERVA.call('einstellungenSave', [p], 'settings').then(function (d) { if (d) { MINERVA.toast('Einstellungen gespeichert.'); return MINERVA.reload(); } });
    },
    'core.pic': function (ds, el) {
      const file = el.files && el.files[0]; if (!file) return;
      shrink(file).then(function (data) {
        MINERVA.data.settings.PROFILBILD = data; MINERVA.render();
        return MINERVA.call('profilSave', [{ PROFILBILD: data }], 'settings');
      }).then(function (d) { if (d) MINERVA.toast('Profilbild gespeichert.'); }).catch(function (e) { MINERVA.toast(e.message || String(e)); });
    },
    'core.fbstat': function (ds, el) { (MINERVA.data.feedback || []).forEach(function (f) { if (f.ID === ds.id) f.Status = el.value; }); MINERVA.render(); MINERVA.call('feedbackStatus', [ds.id, el.value], 'feedback'); },
    'core.mod': function (ds) {
      const on = ds.on !== 'true';
      const off = String(MINERVA.data.settings.MODULE_AUS || '').split(',').map(function (x) { return x.trim(); }).filter(String).filter(function (x) { return x !== ds.id; });
      if (!on) off.push(ds.id);
      if (off.length >= MINERVA.data.modules.length) { MINERVA.toast('Mindestens ein Modul muss aktiv bleiben.'); return; }
      MINERVA.data.settings.MODULE_AUS = off.join(','); MINERVA.render();
      MINERVA.call('moduleSet', [ds.id, on], 'settings');
    },
    'core.picdel': function () { MINERVA.data.settings.PROFILBILD = ''; MINERVA.render(); MINERVA.call('profilSave', [{ PROFILBILD: '' }], 'settings'); }
  });
})();
</script>

  <script>
/* ARIADNE · ADHS-Navigator
   Navigator: in höchstens 5 Schritten vom Gefühl zu 2–3 passenden Techniken. Jeder Schritt ist überspringbar.
   Frühwarn-Ampel: Signale und Maßnahmen für Grün, Gelb, Rot (bei Rot keine Techniken, sondern Hilfe holen).
   Werkzeugkasten: alle Techniken, „Meine Muster“ aus dem Sheet und die Spielregeln.
   Die Inhalte kommen live aus dem Sheet „ADHS Exekutivfunktionen“ und werden erst geladen, wenn ARIADNE offen ist. */
(function () {
  const ui = { step: 1, hist: [], direct: [], gruppen: [], bild: null, queue: [], pos: 0, ef: null, problem: null, neu: false, lage: '', energie: '', antrieb: '', chooser: false, tab: 'tech', filt: '', ampel: null, loading: false, loadedOnce: false };
  const D = function () { return MINERVA.data.ariadne; };
  const ENERGIE = ['niedrig', 'mittel', 'hoch'];
  const ANTRIEBE = [
    { id: 'Interesse', tipp: 'Verknüpf es mit etwas, das dich gerade wirklich interessiert.' },
    { id: 'Neuheit', tipp: 'Mach es diesmal anders: anderer Ort, andere Reihenfolge, neues Werkzeug.' },
    { id: 'Herausforderung', tipp: 'Mach ein kleines Spiel daraus, z. B. Timer auf 10 Minuten: Wie weit kommst du?' },
    { id: 'Dringlichkeit', tipp: 'Setz dir eine echte kleine Frist: Timer stellen oder jemandem Bescheid sagen.' }
  ];
  const AMPEL = {
    'grün': { tint: 'lvl-gruen', titel: 'Grün', sub: 'Normaler ADHS-Alltag' },
    'gelb': { tint: 'lvl-gelb', titel: 'Gelb', sub: 'Achtsam werden, Last rausnehmen' },
    'rot': { tint: 'lvl-rot', titel: 'Rot', sub: 'Hilfe holen, nicht allein lösen' }
  };
  const JUMPS = { T17: { mod: 'janus', sub: 'routinen', label: 'Zur Routine', icon: 'rout' }, T18: { mod: 'janus', sub: 'packliste', label: 'Zur Packliste', icon: 'pack' } };

  const F = function (id) { return D().funktionen.filter(function (f) { return f.id === id; })[0]; };
  const T = function (id) { return D().techniken.filter(function (t) { return t.id === id; })[0]; };
  const G = function (id) { return D().gruppen.filter(function (g) { return g.id === id; })[0]; };
  const efsOf = function (gs) { return D().funktionen.filter(function (f) { return gs.indexOf(f.gruppe) > -1; }).sort(function (a, b) { return gs.indexOf(a.gruppe) - gs.indexOf(b.gruppe); }); };
  const fb = function () { return D().feedback || []; };
  const stats = function (tid) {
    const s = { ja: 0, nein: 0 };
    fb().forEach(function (f) { if (f.TechnikID === tid) { if (f.Geholfen === 'ja') s.ja++; else if (f.Geholfen === 'nein') s.nein++; } });
    return s;
  };
  const offen = function () {
    const lim = Date.now() - 14 * 86400000;
    return fb().filter(function (f) { return !f.Geholfen && new Date(f.Datum).getTime() > lim; }).slice(0, 3);
  };
  const ampelKey = function (s) { return String(s || '').toLowerCase(); };

  /* ---------- Daten laden ---------- */
  function load(force) {
    if (ui.loading) return;
    ui.loading = true;
    MINERVA.api('ariadneData', !!force).then(function (d) {
      ui.loading = false; ui.loadedOnce = true; MINERVA.data.ariadne = d; MINERVA.render();
    }).catch(function (e) {
      ui.loading = false; MINERVA.data.ariadne = { fehler: e && e.message ? e.message : String(e), feedback: [] }; MINERVA.render();
    });
  }
  /** Gibt HTML zurück, solange die Daten fehlen (und stößt das Laden an), sonst null. */
  function gate(sub) {
    const d = D();
    if (!d) {
      // Nach „Synchronisieren“ ist der Datenbereich leer: dann das Sheet frisch einlesen.
      setTimeout(function () { load(ui.loadedOnce); }, 0);
      return topbar('ARIADNE', sub) + '<div class="card glass loading" style="min-height:40vh"><span class="cicon t-blau">' + ic('ariadne') + '</span><span class="sub">Dein ADHS-Sheet wird gelesen …</span></div>';
    }
    if (d.fehler) {
      return topbar('ARIADNE', sub) + '<div class="card glass"><h1 class="title">ARIADNE konnte nicht laden</h1><p class="sub" style="margin:0">' + esc(d.fehler) + '</p>' +
        '<p class="small" style="margin:0">Die Inhalte kommen aus deinem Sheet „ADHS Exekutivfunktionen“. Es muss demselben Google-Konto gehören wie MINERVA.</p>' +
        '<button class="btn" data-act="ar.retry">Erneut versuchen</button></div>';
    }
    return null;
  }

  /* ---------- Wizard-Zustand ---------- */
  const SNAP = ['step', 'direct', 'gruppen', 'bild', 'queue', 'pos', 'ef', 'problem', 'neu', 'lage', 'energie', 'antrieb', 'chooser'];
  function push() { const s = {}; SNAP.forEach(function (k) { s[k] = JSON.parse(JSON.stringify(ui[k])); }); ui.hist.push(s); }
  function back() { const s = ui.hist.pop(); if (s) Object.assign(ui, s); MINERVA.render(); window.scrollTo(0, 0); }
  function reset() { Object.assign(ui, { step: 1, hist: [], direct: [], gruppen: [], bild: null, queue: [], pos: 0, ef: null, problem: null, neu: false, lage: '', energie: '', antrieb: '', chooser: false }); }
  function goStep(n) { ui.step = n; ui.neu = false; MINERVA.render(); window.scrollTo(0, 0); }
  function chooseGroups(gs, bild) {
    push();
    ui.gruppen = gs; ui.bild = bild || null; ui.queue = efsOf(gs).map(function (f) { return f.id; }); ui.pos = 0; ui.chooser = false; ui.ef = null; ui.problem = null;
    goStep(2);
  }

  /* ---------- Vorschläge (Schritt 5) ---------- */
  function vorschlaege() {
    const efs = ui.ef ? [ui.ef] : efsOf(ui.gruppen).map(function (f) { return f.id; });
    const pt = ui.problem && ui.problem.techniken ? ui.problem.techniken : [];
    const f0 = ui.ef && F(ui.ef);
    const grp = efsOf(f0 ? [f0.gruppe] : ui.gruppen).map(function (f) { return f.id; });
    const rank = function (e) { return ENERGIE.indexOf(e); };
    const all = D().techniken.map(function (t) {
      let s = 0;
      const pi = pt.indexOf(t.id);
      if (pi > -1) s += 10 - pi * 0.2;
      const di = ui.direct.indexOf(t.id);
      if (di > -1) s += 20 - di * 0.2;
      if (t.efs.some(function (e) { return efs.indexOf(e) > -1; })) s += 5;
      else if (t.efs.some(function (e) { return grp.indexOf(e) > -1; })) s += 1;
      if (!s) return null;
      s -= t.efs.length * 0.05; // spezifische Techniken vor Allroundern
      const ei = Math.min.apply(null, t.efs.map(function (e) { const k = efs.indexOf(e); return k < 0 ? 99 : k; }));
      if (ei < 99) s -= ei * 0.03;
      const st = stats(t.id);
      s += Math.min(st.ja, 3) * 0.8 - Math.min(st.nein, 3) * 0.5;
      const fitW = !ui.lage || t.wann === 'beides' || t.wann === ui.lage;
      const fitE = !ui.energie || rank(t.energie) <= rank(ui.energie);
      return { t: t, s: s, fit: (fitW && fitE) || di > -1, warum: !fitW ? (t.wann === 'akut' ? 'eher für den akuten Moment' : 'eher vorbeugend') : (!fitE ? 'braucht etwas mehr Energie' : '') };
    }).filter(Boolean).sort(function (a, b) { return b.s - a.s; });
    const passt = all.filter(function (x) { return x.fit; }).slice(0, ui.direct.length ? 2 : 3);
    if (passt.length < 2) all.filter(function (x) { return !x.fit; }).slice(0, 2 - passt.length + (passt.length ? 0 : 1)).forEach(function (x) { passt.push(x); });
    return passt;
  }

  /* ---------- Bausteine ---------- */
  function dots() {
    return '<div class="adots" aria-label="Schritt ' + ui.step + ' von 5">' + [1, 2, 3, 4, 5].map(function (i) { return '<span class="' + (i <= ui.step ? 'on' : '') + '"></span>'; }).join('') + '</div>';
  }
  function badgeWann(t) { return '<span class="badge blau">' + (t.wann === 'beides' ? 'akut & vorbeugend' : esc(t.wann)) + '</span>'; }
  function techCard(t, opts) {
    opts = opts || {};
    const st = stats(t.id);
    const open = fb().filter(function (f) { return f.TechnikID === t.id && !f.Geholfen; })[0];
    const jump = JUMPS[t.id];
    const ask = open && opts.ask;
    const live = MINERVA.arTools && MINERVA.arTools[t.id] ? '<button class="btn sm" data-act="tl.open" data-t="' + esc(t.id) + '">' + ic('chev', 16) + ' Jetzt durchgehen</button>' : '';
    return '<div class="kcard atech"><div style="display:flex;flex-direction:column;gap:6px;min-width:0">' +
      '<span class="small" style="letter-spacing:.06em">' + esc(t.id) + (opts.warum ? ' · ' + esc(opts.warum) : '') + '</span>' +
      '<span class="ttl">' + esc(t.name) + '</span><span style="font-size:15px;line-height:1.45;color:var(--ink-2)">' + esc(t.text) + '</span>' +
      '<span class="badges">' + badgeWann(t) + '<span class="badge grau">Energie ' + esc(t.energie) + '</span>' +
      (st.ja ? '<span class="badge petrol">hat ' + (st.ja === 1 ? 'einmal' : st.ja + '×') + ' geholfen</span>' : '') + '</span>' +
      (opts.efs ? '<span class="small">' + esc(t.efs.map(function (e) { const f = F(e); return f ? f.name : e; }).join(' · ')) + '</span>' : '') + '</div>' +
      (ask ? (live ? '<div class="kactions">' + live + '</div>' : '') + '<div class="askrow"><span>Hat es geholfen? <span class="small">Geht auch später.</span></span><div class="kactions">' +
          '<button class="btn soft sm" data-act="ar.answer" data-id="' + esc(open.ID) + '" data-t="' + esc(t.id) + '" data-v="ja">' + ic('check', 16, 2.4) + ' Ja</button>' +
          '<button class="btn ghost sm" data-act="ar.answer" data-id="' + esc(open.ID) + '" data-t="' + esc(t.id) + '" data-v="nein">Nein</button></div></div>'
        : '<div class="kactions">' + (MINERVA.arTools && MINERVA.arTools[t.id] ? '<button class="btn sm" data-act="tl.open" data-t="' + esc(t.id) + '">' + ic('chev', 16) + ' Jetzt durchgehen</button>' : '') + (jump ? '<button class="btn soft sm" data-act="ar.jump" data-t="' + esc(t.id) + '">' + ic(jump.icon, 16) + ' ' + esc(jump.label) + '</button>' : '') +
          (open ? '<span class="small" style="align-self:center">Ausprobiert ' + esc(age(open.Datum)) + '</span>' :
            '<button class="btn lila sm" data-act="ar.try" data-t="' + esc(t.id) + '">' + ic('sparkle', 16) + ' Probiere ich</button>') + '</div>') +
      '</div>';
  }
  function offenHtml() {
    const list = offen();
    if (!list.length) return '';
    return '<section class="panel"><div class="sechead"><span class="cicon t-blau">' + ic('sparkle') + '</span><h2>Hat es geholfen?</h2></div>' +
      list.map(function (f) {
        return '<div class="afb"><span style="display:flex;flex-direction:column;gap:3px;min-width:0"><b style="font-weight:500">' + esc(f.Technik || f.TechnikID) + '</b><span class="small">ausprobiert ' + esc(age(f.Datum)) + '</span></span>' +
          '<span class="kactions"><button class="btn soft sm" data-act="ar.answer" data-id="' + esc(f.ID) + '" data-t="' + esc(f.TechnikID) + '" data-v="ja">Ja</button>' +
          '<button class="btn ghost sm" data-act="ar.answer" data-id="' + esc(f.ID) + '" data-t="' + esc(f.TechnikID) + '" data-v="nein">Nein</button>' +
          '<button class="btn ghost sm" data-act="ar.answer" data-id="' + esc(f.ID) + '" data-t="' + esc(f.TechnikID) + '" data-v="ausgeblendet" title="Nicht mehr fragen">Nicht mehr fragen</button></span></div>';
      }).join('') + '</section>';
  }

  /* ---------- Navigator: die fünf Schritte ---------- */
  function step1() {
    const lex = D().lexikon.map(function (l, i) {
      return '<button class="atile" data-act="ar.bild" data-i="' + i + '"><b>' + esc(l.bild) + '</b><span class="small">' + esc(l.text) + '</span></button>';
    }).join('');
    const grp = D().gruppen.map(function (g) {
      return '<button class="atile grp" data-act="ar.grp" data-g="' + g.id + '"><b>„' + esc(g.satz) + '“</b><span class="small">' + esc(g.id + ' · ' + g.name) + '</span></button>';
    }).join('');
    return '<h2 class="aq">Was ist gerade los?</h2>' +
      '<p class="small" style="margin:-4px 0 0">Tipp das Bild oder den Satz an, der am besten passt.</p>' +
      '<div class="wcat">In meinen Worten</div><div class="atiles two">' + grp + '</div>' +
      (lex ? '<div class="wcat">Meine Bilder</div><div class="atiles">' + lex + '</div>' : '');
  }
  function step2() {
    const gs = ui.gruppen.map(function (g) { const x = G(g); return x ? g + ' · ' + x.name : g; }).join(' / ');
    const hint = ui.bild && ui.bild.ampel ? '<div class="ahint"><span>„' + esc(ui.bild.bild) + '“ steht auch in deiner Frühwarn-Ampel.</span><button class="btn ghost sm" data-act="nav.go" data-mod="ariadne" data-sub="ampel">' + ic('ampel', 16) + ' Ampel ansehen</button></div>' : '';
    if (ui.chooser || ui.pos >= ui.queue.length) {
      return '<h2 class="aq">Welche Funktion passt am ehesten?</h2>' +
        '<p class="small" style="margin:-4px 0 0">' + (ui.pos >= ui.queue.length && !ui.chooser ? 'Keine Frage hat genau gepasst – das ist in Ordnung. ' : '') + esc(gs) + '</p>' + hint +
        '<div class="atiles">' + efsOf(ui.gruppen).map(function (f) {
          return '<button class="atile" data-act="ar.ef" data-id="' + f.id + '"><b>' + esc(f.name) + '</b><span class="small">' + esc(f.worte) + '</span></button>';
        }).join('') + '</div>' +
        '<button class="btn ghost center" data-act="ar.noef">Ohne genaue Funktion weiter ' + ic('chev', 16) + '</button>';
    }
    const f = F(ui.queue[ui.pos]);
    return '<span class="eyebrow">' + esc(gs) + ' · Frage ' + (ui.pos + 1) + ' von ' + ui.queue.length + '</span>' +
      '<h2 class="aq">' + esc(f.frage) + '</h2>' + hint +
      '<div class="grid2 yesno"><button class="btn ghost big" data-act="ar.nein">Nein</button><button class="btn big" data-act="ar.ja">' + ic('check', 18, 2.4) + ' Ja, genau</button></div>' +
      '<button class="btn ghost sm center" data-act="ar.chooser">Lieber direkt auswählen</button>';
  }
  function step3() {
    const f = ui.ef && F(ui.ef);
    const list = D().probleme.filter(function (p) { return ui.ef ? p.ef === ui.ef : ui.gruppen.indexOf(p.gruppe) > -1; });
    const head = '<span class="eyebrow">' + esc(f ? f.name : ui.gruppen.map(function (g) { return G(g) ? G(g).name : g; }).join(' / ')) + '</span><h2 class="aq">Kenne ich das schon?</h2>';
    if (ui.neu) {
      return head + field('ar-neu', 'Was ist los? Ein Satz reicht.', '<textarea id="ar-neu" class="input" rows="3" placeholder="z. B. Ich komme nach dem Mittag nicht mehr in die Arbeit rein." autofocus></textarea>') +
        '<p class="small" style="margin:0">Wird in deinem ADHS-Sheet unter „Meine Liste“ als „neu – prüfen“ gemerkt. Du entscheidest dort später, ob es bleibt.</p>' +
        '<div class="grid2"><button class="btn ghost" data-act="ar.neuab">Abbrechen</button><button class="btn" data-act="ar.neusave">Merken & weiter</button></div>';
    }
    return head + (list.length ? '<div class="atiles one">' + list.map(function (p) {
      return '<button class="atile" data-act="ar.prob" data-id="' + p.id + '"><b>' + esc(p.kurz || p.text) + '</b>' + (p.kurz ? '<span style="font-size:14px;line-height:1.45;color:var(--ink-2)">' + esc(p.text) + '</span>' : '') + '<span class="badges">' + (p.bereich ? '<span class="badge grau">' + esc(p.bereich) + '</span>' : '') +
        (p.ausloeser ? '<span class="small">' + esc(p.ausloeser) + '</span>' : '') + '</span></button>';
    }).join('') + '</div>' : '<p class="empty">Dazu steht noch nichts in deiner Liste.</p>') +
      '<div class="grid2"><button class="btn ghost" data-act="ar.neu">' + ic('plus', 16, 2) + ' Etwas Neues</button><button class="btn ghost" data-act="ar.skip3">Überspringen ' + ic('chev', 16) + '</button></div>';
  }
  function step4() {
    const seg = function (key, opts) {
      return '<div class="seg" role="group">' + opts.map(function (o) {
        return '<button data-act="ar.set" data-k="' + key + '" data-v="' + o[0] + '" aria-pressed="' + (ui[key] === o[0]) + '">' + (o[2] ? ic(o[2], 16) + ' ' : '') + esc(o[1]) + '</button>';
      }).join('') + '</div>';
    };
    return '<h2 class="aq">Wie ist meine Lage?</h2><p class="small" style="margin:-4px 0 0">Alles freiwillig – lass weg, was du nicht weißt.</p>' +

  /* ---------- Interaktive Techniken ----------

  const tool = { id: null, step: 0, v: {}, timer: null };

  const lines = function (s) { return String(s || '').split(/\n+/).map(function (x) { return x.trim(); }).filter(String); };
  const big = function (html) { return '<div class="tbig">' + html + '</div>'; };
  const nav = function (nextLabel, opts) {

      '<button class="btn" data-act="' + (opts.act || 'tl.next') + '">' + esc(nextLabel || 'Weiter') + '</button></div>';
  };
  const done = function (label) { return '<button class="btn big" data-act="tl.close">' + esc(label || 'Fertig') + '</button><p class="small" style="margin:0;text-align:center">Nichts davon wird gespeichert.</p>'; };

  };
  function stopTimer() { if (tool.timer) { clearInterval(tool.timer); tool.timer = null; } }
  /** Läuft einen Ablauf [{ text, sek }] durch und zeigt ihn im Element #tl-run. */
  function runSequence(seq, onEnd) {
    stopTimer();
    let i = 0, left = seq[0].sek;
    const paint = function () {
      const el = document.getElementById('tl-run'); if (!el) { stopTimer(); return; }
      el.innerHTML = '<span class="tphase ' + (seq[i].cls || '') + '">' + esc(seq[i].text) + '</span><span class="small">' + left + ' s</span>';
    };
    paint();
    tool.timer = setInterval(function () {
      left--;
      if (left <= 0) { i++; if (i >= seq.length) { stopTimer(); onEnd(); return; } left = seq[i].sek; }
      paint();
    }, 1000);

      },
      function () { return input('mini', 'Was ist der allererste Mini-Schritt der nächsten Sache?', 'z. B. Dokument öffnen') + nav('Weiter'); },
      function () { return '<span class="eyebrow" style="text-align:center">Nur das</span>' + big(esc(tool.v.mini || 'Anfangen.')) + done('Los geht’s'); }
    ] }
  };

  function toolHtml() {
    const t = TOOLS[tool.id]; if (!t) return '';
    const n = t.schritte.length;
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 class="mtitle">' + esc(t.titel) + '</h2>' +
      '<button class="iconbtn sm" data-act="tl.close" aria-label="Schließen">' + ic('x', 18) + '</button></div>' +
      '<div class="adots">' + t.schritte.map(function (_, i) { return '<span class="' + (i <= tool.step ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
      t.schritte[Math.min(tool.step, n - 1)]();
  }
  function collect() { document.querySelectorAll('#modal [id^="tl-"]').forEach(function (n) { if (n.id !== 'tl-run') tool.v[n.id.slice(3)] = n.value; }); }
  function openTool(id) { stopTimer(); tool.id = id; tool.step = 0; tool.v = {}; MINERVA.openModal(toolHtml, { sticky: true }); }
  MINERVA.arTools = TOOLS;
  Object.assign(MINERVA.actions, {
    'tl.open': function (ds) { openTool(ds.t); },
    'tl.next': function () { collect(); stopTimer(); tool.step = Math.min(tool.step + 1, TOOLS[tool.id].schritte.length - 1); MINERVA.renderModal(true); },
    'tl.prev': function () { collect(); stopTimer(); tool.step = Math.max(0, tool.step - 1); MINERVA.renderModal(true); },
    'tl.close': function () { stopTimer(); tool.id = null; tool.v = {}; MINERVA.closeModal(); },
    'tl.set': function (ds) { tool.v[ds.k] = ds.v; MINERVA.renderModal(); },
    'tl.mark': function (ds) { const m = tool.v.marks || (tool.v.marks = {}); const k = m[ds.i] || (m[ds.i] = {}); k[ds.k] = !k[ds.k]; MINERVA.renderModal(); },
    'tl.area': function (ds) { (tool.v.bereiche || (tool.v.bereiche = {}))[ds.b] = ds.v; MINERVA.renderModal(); },
    'tl.breathe': function (ds, el) {
      el.disabled = true;
      const seq = [];
      for (let i = 0; i < 3; i++) { seq.push({ text: 'Einatmen', sek: 4, cls: 'in' }); seq.push({ text: 'Ausatmen', sek: 6, cls: 'out' }); }
      for (let n = 1; n <= 10; n++) seq.push({ text: String(n), sek: 1 });
      runSequence(seq, function () { tool.step = 1; MINERVA.renderModal(); });
    },
    'tl.bridge': function (ds, el) {
      el.disabled = true;
      runSequence([{ text: 'Aufstehen, durchatmen', sek: 120, cls: 'out' }], function () { tool.step = 2; MINERVA.renderModal(true); });
    }
  });

  /* ---------- Aktionen ---------- */
  function tryTech(id) {
    const t = T(id); if (!t) return;
    fb().unshift({ ID: 'tmp_' + Date.now(), Datum: new Date().toISOString(), TechnikID: id, Technik: t.name, ProblemID: ui.problem ? ui.problem.id : '', Geholfen: '' });
    MINERVA.call('ariadneTry', [{ technikId: id, technik: t.name, problemId: ui.problem ? ui.problem.id : '', funktionId: ui.ef || '', lage: ui.lage, energie: ui.energie, antrieb: ui.antrieb }], 'ariadne');
  }
  Object.assign(MINERVA.actions, {
    'ar.retry': function () { MINERVA.data.ariadne = null; load(true); MINERVA.render(); },
    'ar.grp': function (ds) { chooseGroups([ds.g]); },
    'ar.bild': function (ds) {
      const l = D().lexikon[Number(ds.i)]; if (!l) return;
      if (!l.gruppen.length) { ui.ampel = null; MINERVA.go('ariadne', 'ampel'); MINERVA.toast('„' + l.bild + '“ ist ein Signal aus deiner Frühwarn-Ampel.'); return; }
      if (l.techniken && l.techniken.length) { push(); ui.direct = l.techniken.slice(); ui.gruppen = l.gruppen.slice(); ui.bild = l; ui.ef = null; ui.problem = null; goStep(5); return; }
      chooseGroups(l.gruppen, l);
    },
    'ar.ja': function () { push(); ui.ef = ui.queue[ui.pos]; goStep(3); },
    'ar.nein': function () { push(); ui.pos++; MINERVA.render(); },
    'ar.chooser': function () { push(); ui.chooser = true; MINERVA.render(); },
    'ar.ef': function (ds) { push(); ui.ef = ds.id; goStep(3); },
    'ar.noef': function () { push(); ui.ef = null; goStep(3); },
    'ar.prob': function (ds) { push(); ui.problem = D().probleme.filter(function (p) { return p.id === ds.id; })[0] || null; goStep(4); },
    'ar.skip3': function () { push(); ui.problem = null; goStep(4); },
    'ar.neu': function () { ui.neu = true; MINERVA.render(); },
    'ar.neuab': function () { ui.neu = false; MINERVA.render(); },
    'ar.neusave': function () {
      const el = document.getElementById('ar-neu'); const v = (el && el.value || '').trim();
      if (!v) { if (el) el.focus(); MINERVA.toast('Ein kurzer Satz reicht.'); return; }
      push(); ui.problem = { id: '', text: v, techniken: [] }; goStep(4);
      MINERVA.api('ariadneProblemAdd', v, ui.ef || '').then(function (d) {
        MINERVA.data.ariadne = d; if (ui.problem && ui.problem.text === v) ui.problem.id = d.neuId || '';
        MINERVA.toast('In deinem Sheet gemerkt (' + (d.neuId || 'neu') + ').'); MINERVA.render();
      }).catch(function (e) { MINERVA.toast('Konnte nicht ins Sheet schreiben: ' + (e && e.message ? e.message : e)); });
    },
    'ar.set': function (ds) { ui[ds.k] = ui[ds.k] === ds.v ? '' : ds.v; MINERVA.render(); },
    'ar.go5': function () { push(); goStep(5); },
    'ar.back': function () { back(); },
    'ar.restart': function () { reset(); MINERVA.render(); window.scrollTo(0, 0); },
    'ar.try': function (ds) { tryTech(ds.t); MINERVA.render(); MINERVA.toast('Gemerkt. Später kannst du sagen, ob es geholfen hat.'); },
    'ar.jump': function (ds) {
      const j = JUMPS[ds.t]; if (!j) return;
      if (!fb().some(function (f) { return f.TechnikID === ds.t && !f.Geholfen; })) tryTech(ds.t);
      MINERVA.go(j.mod, j.sub);
    },
    'ar.answer': function (ds) {
      fb().forEach(function (f) { if (f.ID === ds.id) f.Geholfen = ds.v; });
      MINERVA.render();
      if (ds.v === 'ja') MINERVA.toast('Schön! Das merkt sich ARIADNE für die nächsten Vorschläge.');
      else if (ds.v === 'nein') MINERVA.toast('Danke – auch das ist eine wichtige Erkenntnis.');
      MINERVA.call('ariadneAnswer', [ds.id, ds.v, ds.t], 'ariadne');
    },
    'ar.ampel': function (ds) { ui.ampel = ui.ampel === ds.k ? null : ds.k; MINERVA.render(); },
    'ar.tonavi': function () { reset(); MINERVA.go('ariadne', 'navigator'); },
    'ar.tab': function (ds) { ui.tab = ds.v; MINERVA.render(); },
    'ar.filt': function (ds) { ui.filt = ds.v; MINERVA.render(); },
    'ar.fromprob': function (ds) {
      const p = D().probleme.filter(function (x) { return x.id === ds.id; })[0]; if (!p) return;
      reset(); ui.hist = []; ui.gruppen = [p.gruppe]; ui.ef = p.ef || null; ui.problem = p; ui.step = 4;
      MINERVA.go('ariadne', 'navigator');
    }
  });

  /* Für den Bereich „Gesundheit“: direkt mit vorgewählter Stufe in die Ampel springen. */
  MINERVA.ariadneAmpel = function (k) { ui.ampel = k; MINERVA.go('ariadne', 'ampel'); };

  MINERVA.searchProviders.push(function (q) {
    const d = D(); if (!d || !d.techniken) return [];
    return d.techniken.filter(function (t) { return MINERVA.matches(q, [t.name, t.text]); }).map(function (t) {
      return { title: t.name, meta: 'Technik ' + t.id, modName: 'ARIADNE', icon: 'tools', open: function () { ui.tab = 'tech'; ui.filt = ''; MINERVA.go('ariadne', 'werkzeug'); } };
    }).concat(d.probleme.filter(function (p) { return MINERVA.matches(q, [p.text, p.bereich]); }).map(function (p) {
      return { title: p.text, meta: 'Meine Muster', modName: 'ARIADNE', icon: 'ariadne', open: function () { ui.tab = 'muster'; MINERVA.go('ariadne', 'werkzeug'); } };
    }));
  });
})();
</script>

  <script>
/* ARIADNE · Gesundheit – Wochen-Check-in als Frühwarnsystem
   Einmal pro Woche: Energie und Belastung (eigene Einschätzung), dazu Werte aus Garmin Connect, wenn zur Hand.
   Alles ist freiwillig, Lücken sind in Ordnung, es gibt keine Streaks und keine Erinnerungen.
   Auswertung: Jede Woche wird mit deinem eigenen Normalwert (Median der bis zu 8 Wochen davor) verglichen.
   Ein Hinweis kommt erst, wenn mehrere Signale zusammenkommen – und nur, solange der letzte Eintrag aktuell ist. */
(function () {
  const ui = { f: null };
  const G = function () { return (MINERVA.data.gesund && MINERVA.data.gesund.wochen) || []; };
  const HRV = [['ausgeglichen', 'Ausgeglichen'], ['unausgeglichen', 'Unausgeglichen'], ['niedrig', 'Niedrig'], ['schlecht', 'Schlecht']];
  const HRV_NAME = { ausgeglichen: 'Ausgeglichen', unausgeglichen: 'Unausgeglichen', niedrig: 'Niedrig', schlecht: 'Schlecht' };
  const NUM = [
    { k: 'Schlaf', label: 'Schlaf', einheit: 'h', ph: 'z. B. 7,2', step: '0.1', hilfe: 'Ø Schlafdauer der Woche' },
    { k: 'BodyBattery', label: 'Body Battery morgens', einheit: '', ph: 'z. B. 70', step: '1', hilfe: 'Ø Wert beim Aufwachen' },
    { k: 'Ruhepuls', label: 'Ruhepuls', einheit: 'bpm', ph: 'z. B. 58', step: '1', hilfe: 'Ø der letzten 7 Tage' },
    { k: 'Stress', label: 'Stress', einheit: '', ph: 'z. B. 32', step: '1', hilfe: 'Ø Stresslevel der Woche' },
    { k: 'Gewicht', label: 'Gewicht', einheit: 'kg', ph: 'z. B. 82,4', step: '0.1', hilfe: 'Nur zum Mitschauen, keine Bewertung' }
  ];
  const STUFE = {
    ruhig: { tint: 'lvl-gruen', titel: 'Ruhig', satz: 'Deine Werte sehen nach einer normalen Woche aus.' },
    achtsam: { tint: 'lvl-gelb', titel: 'Achtsam sein', satz: 'Mehrere Werte zeigen gerade mehr Belastung als sonst. Ein guter Moment, Last rauszunehmen.' },
    ernst: { tint: 'lvl-rot', titel: 'Ernst nehmen', satz: 'Schon länger zeigen mehrere Werte Belastung. Schau in deine Frühwarn-Ampel und hol dir Unterstützung, wenn Rot passt.' }
  };

  /* ---------- Wochen & Zahlen ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parse(s) { const p = String(s).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function montag(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
  function plusTage(s, n) { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
  function kw(s) {
    const d = parse(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const j = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - j) / 86400000 - 3 + ((j.getDay() + 6) % 7)) / 7);
  }
  function wocheLabel(s) {
    const a = parse(s), b = parse(plusTage(s, 6));
    const fa = a.getMonth() === b.getMonth() ? a.getDate() + '.' : a.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
    return 'KW ' + kw(s) + ' · ' + fa + '–' + b.toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
  }
  function diese() { return iso(montag(new Date())); }
  function letzte() { return plusTage(diese(), -7); }
  function zahl(v) { return v === '' || v == null || !isFinite(Number(v)) ? null : Number(v); }
  function fmt(v, dez) { return v == null ? '–' : Number(v).toLocaleString('de-DE', { minimumFractionDigits: dez || 0, maximumFractionDigits: dez || 0 }); }
  function median(a) { if (!a.length) return null; const s = a.slice().sort(function (x, y) { return x - y; }); const m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }
  function byWoche(w) { return G().filter(function (x) { return x.Woche === w; })[0] || null; }

  /* ---------- Auswertung ---------- */
  /** Normalwert je Wert aus den bis zu 8 Wochen vor „woche“ (mindestens 3 Werte nötig). */
  function normal(woche, k) {
    const vals = G().filter(function (x) { return x.Woche < woche; }).slice(0, 8).map(function (x) { return zahl(x[k]); }).filter(function (v) { return v != null; });
    return vals.length >= 3 ? median(vals) : null;
  }
  function signale(w) {
    if (!w) return [];
    const out = [];
    const e = zahl(w.Energie), b = zahl(w.Belastung), s = zahl(w.Schlaf), bb = zahl(w.BodyBattery), p = zahl(w.Ruhepuls), st = zahl(w.Stress);
    if (e != null && e <= 2) out.push('Wenig Energie (' + e + ' von 5)');
    if (b != null && b >= 4) out.push('Hohe Belastung (' + b + ' von 5)');
    if (s != null) { const n = normal(w.Woche, 'Schlaf'); if (s < 6.5 || (n != null && s < n - 0.75)) out.push('Weniger Schlaf (Ø ' + fmt(s, 1) + ' h' + (n != null ? ', sonst ' + fmt(n, 1) + ' h' : '') + ')'); }
    if (w.HRV && w.HRV !== 'ausgeglichen') out.push('HRV-Status: ' + (HRV_NAME[w.HRV] || w.HRV));
    if (bb != null) { const n = normal(w.Woche, 'BodyBattery'); if (bb < 40 || (n != null && bb < n - 15)) out.push('Body Battery morgens niedrig (' + fmt(bb) + (n != null ? ', sonst ' + fmt(n) : '') + ')'); }
    if (p != null) { const n = normal(w.Woche, 'Ruhepuls'); if (n != null && p > n + 4) out.push('Ruhepuls erhöht (' + fmt(p) + ' bpm, sonst ' + fmt(n) + ')'); }
    if (st != null) { const n = normal(w.Woche, 'Stress'); if (st > 50 || (n != null && st > n + 8)) out.push('Stress höher als sonst (Ø ' + fmt(st) + (n != null ? ', sonst ' + fmt(n) : '') + ')'); }
    return out;
  }
  /** Gesamtbild: { stufe: 'leer' | 'alt' | 'ruhig' | 'achtsam' | 'ernst', woche, signale, tage } */
  function lage() {
    const w = G()[0];
    if (!w) return { stufe: 'leer', signale: [] };
    const tage = Math.round((parse(diese()) - parse(w.Woche)) / 86400000);
    if (tage > 14) return { stufe: 'alt', woche: w, signale: [], tage: tage };
    const sig = signale(w);
    const vorher = G()[1] && Math.round((parse(w.Woche) - parse(G()[1].Woche)) / 86400000) <= 7 ? signale(G()[1]) : [];
    let stufe = 'ruhig';
    if (sig.length >= 4 || (sig.length >= 2 && vorher.length >= 2)) stufe = 'ernst';
    else if (sig.length >= 2 || (sig.length >= 1 && vorher.length >= 1)) stufe = 'achtsam';
    return { stufe: stufe, woche: w, signale: sig, vorher: vorher.length, tage: tage };
  }
  MINERVA.gesundLage = lage;

  /* ---------- Kleine Verlaufslinie (eine Reihe, letzter Punkt betont) ---------- */
  function spark(werte, label, einheit, dez) {
    const pts = werte.map(function (v, i) { return { v: v, i: i }; }).filter(function (p) { return p.v != null; });
    if (pts.length < 2) return '<div class="gspark empty"><span class="small">Verlauf ab zwei Wochen</span></div>';
    const W = 220, H = 48, P = 6;
    let min = Math.min.apply(null, pts.map(function (p) { return p.v; })), max = Math.max.apply(null, pts.map(function (p) { return p.v; }));
    if (max - min < 1e-9) { min -= 1; max += 1; }
    const x = function (i) { return P + (W - 2 * P) * (werte.length === 1 ? 0.5 : i / (werte.length - 1)); };
    const y = function (v) { return H - P - (H - 2 * P) * (v - min) / (max - min); };
    const d = pts.map(function (p, j) { return (j ? 'L' : 'M') + x(p.i).toFixed(1) + ' ' + y(p.v).toFixed(1); }).join(' ');
    const last = pts[pts.length - 1];
    const dots = pts.map(function (p) {
      return '<circle cx="' + x(p.i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="9" fill="transparent"><title>' + esc(fmt(p.v, dez) + (einheit ? ' ' + einheit : '')) + '</title></circle>';
    }).join('');
    return '<svg class="gspark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(label + ': Verlauf der letzten ' + werte.length + ' Wochen') + '">' +
      '<path d="' + d + '" fill="none" stroke="#3E6CC6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
      '<circle cx="' + x(last.i).toFixed(1) + '" cy="' + y(last.v).toFixed(1) + '" r="4" fill="#3E6CC6" stroke="#fff" stroke-width="2" vector-effect="non-scaling-stroke"/>' + dots + '</svg>';
  }
  /** Die letzten 8 Kalenderwochen bis zur neuesten eingetragenen, Lücken bleiben leer. */
  function reihe() {
    const w0 = G()[0]; if (!w0) return [];
    const out = [];
    for (let i = 7; i >= 0; i--) out.push(byWoche(plusTage(w0.Woche, -7 * i)));
    return out;
  }

  /* ---------- Ansicht ---------- */
  function stufeHtml(l) {
    if (l.stufe === 'leer') return '<p class="small" style="margin:0">Noch keine Woche eingetragen. Ab drei Wochen kennt MINERVA deine Normalwerte und vergleicht damit.</p>';
    if (l.stufe === 'alt') return '<p class="small" style="margin:0">Der letzte Eintrag ist ' + Math.round(l.tage / 7) + ' Wochen her. Das ist in Ordnung – wenn du magst, trag einfach die aktuelle Woche ein.</p>';
    const m = STUFE[l.stufe];
    return '<div class="gstufe"><span class="cicon ' + m.tint + '"><span class="adot"></span></span><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><b>' + esc(m.titel) + '</b><span class="small">' + esc(m.satz) + '</span></span></div>';
  }
  function hinweisPanel(l) {
    if (l.stufe !== 'achtsam' && l.stufe !== 'ernst') return '';
    return '<section class="panel"><div class="sechead"><span class="cicon t-blau">' + ic('ampel') + '</span><h2>Was mir auffällt</h2></div>' +
      '<ul class="asig">' + l.signale.map(function (s) { return '<li>' + esc(s) + '</li>'; }).join('') +
      (l.vorher ? '<li>Schon in der Woche davor ' + (l.vorher === 1 ? 'ein Signal' : l.vorher + ' Signale') + '</li>' : '') + '</ul>' +
      '<div style="padding:4px 10px 12px"><div class="ahint strong"><span>' + (l.stufe === 'ernst' ? 'Das ist kein Grund zur Sorge, aber ein Grund, ehrlich hinzuschauen: Passt gerade Gelb oder schon Rot?' : 'Vergleich das kurz mit deiner Frühwarn-Ampel. Oft reicht es, eine Sache diese Woche wegzulassen.') + '</span>' +
      '<span class="kactions"><button class="btn sm" data-act="gs.ampel" data-k="' + (l.stufe === 'ernst' ? '' : 'gelb') + '">' + ic('ampel', 16) + ' Zur Ampel</button>' +
      '<button class="btn ghost sm" data-act="nav.go" data-mod="ariadne" data-sub="navigator">' + ic('ariadne', 16) + ' Navigator</button></span></div></div></section>';
  }
  function kacheln() {
    const r = reihe();
    const w = G()[0];
    const tile = function (label, wert, einheit, sub, sp) {
      return '<div class="gtile"><span class="small">' + esc(label) + '</span><span class="gval">' + wert + (einheit ? ' <span class="small">' + esc(einheit) + '</span>' : '') + '</span>' +
        (sub ? '<span class="small">' + esc(sub) + '</span>' : '') + sp + '</div>';
    };
    const num = function (k, label, einheit, dez) {
      const werte = r.map(function (x) { return x ? zahl(x[k]) : null; });
      const n = normal(w.Woche, k);
      const akt = zahl(w[k]);
      return tile(label, fmt(akt, dez), akt == null ? '' : einheit, n != null ? 'Dein Normalwert: ' + fmt(n, dez) + (einheit ? ' ' + einheit : '') : '', spark(werte, label, einheit, dez));
    };
    const hrv = '<div class="gtile"><span class="small">HRV-Status</span><span class="gval" style="font-size:20px">' + esc(HRV_NAME[w.HRV] || '–') + '</span>' +
      '<span class="ghrv" aria-label="HRV-Status der letzten 8 Wochen">' + r.map(function (x) {
        const v = x && x.HRV; const t = x ? wocheLabel(x.Woche) + ': ' + (HRV_NAME[v] || 'keine Angabe') : 'keine Angabe';
        return '<span class="' + (v ? (v === 'ausgeglichen' ? 'ok' : 'ab') : 'nix') + '" title="' + esc(t) + '"></span>';
      }).join('') + '</span><span class="small">voll = ausgeglichen · hohl = darunter</span></div>';
    return '<section class="panel"><div class="sechead"><span class="cicon t-blau">' + ic('pulse') + '</span><h2>Letzte 8 Wochen</h2><span class="small">' + esc(wocheLabel(w.Woche)) + '</span></div>' +
      '<div class="gtiles">' + num('Energie', 'Energie', 'von 5', 0) + num('Belastung', 'Belastung', 'von 5', 0) + num('Schlaf', 'Schlaf', 'h', 1) + hrv +
      num('BodyBattery', 'Body Battery morgens', '', 0) + num('Ruhepuls', 'Ruhepuls', 'bpm', 0) + num('Stress', 'Stress', '', 0) + num('Gewicht', 'Gewicht', 'kg', 1) + '</div></section>';
  }
  function liste() {
    return '<section class="panel"><div class="sechead"><span class="cicon t-blau">' + ic('calendar') + '</span><h2>Deine Wochen</h2><span class="count">' + G().length + '</span></div><div class="hlist">' +
      G().slice(0, 12).map(function (w) {
        const teile = [];
        if (zahl(w.Energie) != null) teile.push('Energie ' + w.Energie);
        if (zahl(w.Belastung) != null) teile.push('Belastung ' + w.Belastung);
        if (zahl(w.Schlaf) != null) teile.push(fmt(w.Schlaf, 1) + ' h Schlaf');

})();

  <script>

(function () {

  const wById = function (id) { return W().filter(function (w) { return w.ID === id; })[0]; };
  const sById = function (id) { return SP().filter(function (s) { return s.ID === id; })[0]; };
  const dienst = function (id) { const d = (D().dienste || []).filter(function (x) { return x.id === id; })[0]; return d ? d.name : id; };
  const anb = function (w) { return String(w.Anbieter || '').split(',').map(function (x) { return x.trim(); }).filter(String); };
  const aufAbo = function (w) { const a = D().abos || []; return anb(w).filter(function (x) { return a.indexOf(x) > -1; }); };
  const ohneAbo = function (w) { const a = D().ohneAbo || []; return anb(w).filter(function (x) { return a.indexOf(x) > -1; }); };
  const bekannt = function (w) { return !!w.AnbieterStand; };

  /* ---------- kleine Bausteine ---------- */
  const PH = ['#A797F8,#6B58E3', '#E7A2C6,#B2639F', '#6CCAD4,#2A8DA2', '#84D3AA,#379B76', '#93B9F4,#3E6CC6', '#E6C78F,#B4873F'];
  function hash(s) { let h = 0; s = String(s || ''); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
  /** Bild mit ruhigem Platzhalter darunter: fehlt das Bild oder lädt es nicht, bleibt der Platzhalter sichtbar. */

      (src ? '<img src="' + esc(src) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">' : '') + '</span>';
  }
  function dauer(min) {
    min = Number(min) || 0; if (!min) return '';
    const h = Math.floor(min / 60), m = min % 60;
    return h ? h + ' Std' + (m ? ' ' + m + ' Min' : '') : m + ' Min';
  }
  function wertung(w) {
    if (w.ImdbWertung) return { v: Number(w.ImdbWertung).toFixed(1).replace('.', ','), q: 'IMDb' };

  }

  }
  function hinweisZugang(was) {
    return '<div class="aphint">' + ic('key', 18) + '<span>' + was + ' <button class="linkbtn" data-act="ap.cfg">In CORE einrichten</button></span></div>';
  }

  /* ---------- Poster & Streaming-Infos nachladen ---------- */
  function anreichern(leise) {
    if (ui.enrich && ui.enrich.laeuft) return;
    if (!D().zugang || !D().zugang.tmdb) return;
    ui.enrich = { laeuft: true, leise: !!leise, fertig: 0, start: null, leer: 0 };
    const runde = function () {
      MINERVA.api('apolloAnreichern').then(function (r) {
        MINERVA.data.apollo = r.apollo;
        if (ui.enrich.start === null) ui.enrich.start = r.rest + APOLLO_BATCH_CLIENT;

        if (r.rest > 0 && ui.enrich.leer >= 3) { const l = ui.enrich.leise; ui.enrich = null; MINERVA.render(); if (!l) MINERVA.toast('TMDB antwortet gerade nicht. Die übrigen Poster lädt MINERVA beim nächsten Öffnen.'); return; }

        else { const l = ui.enrich.leise; ui.enrich = null; MINERVA.render(); if (!l) MINERVA.toast('Poster und Streaming-Infos sind aktuell.'); }

    };

  const APOLLO_BATCH_CLIENT = 20;

  }

  /* ---------- IMDb-Export lesen (CSV) ---------- */
  function csv(text) {
    const rows = []; let row = [], f = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === ',') { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
      else f += c;
    }
    if (f || row.length) { row.push(f); rows.push(row); }
    const h = (rows.shift() || []).map(function (x) { return x.replace(/^﻿/, '').trim(); });
    return rows.filter(function (r) { return r.join('') !== ''; }).map(function (r) { const o = {}; h.forEach(function (k, i) { o[k] = r[i] || ''; }); return o; });
  }

  const STIMMUNG = [
